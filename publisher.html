<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Publisher Profile | Markaz.org</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --ink: #17272b; --muted: #657275; --paper: #f7f8f5;
            --teal: #075e59; --deep: #064743; --line: #dce4df;
        }
        body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.7 'DM Sans', sans-serif; }
        .bar { background: #fff; border-bottom: 1px solid var(--line); padding: 12px 20px; }
        .bar a { color: var(--teal); text-decoration: none; font-weight: 600; }
        main { max-width: 900px; margin: 40px auto; padding: 0 20px; }
        .card { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 30px; margin-bottom: 30px; }
        h1 { font-family: 'Playfair Display', serif; color: var(--deep); margin-top: 0; }
        .books-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; margin-top: 20px; }
        .book-card { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 12px; text-decoration: none; color: inherit; }
        .book-card img { width: 100%; aspect-ratio: 3/4; object-fit: cover; border-radius: 6px; }
        .book-card h4 { font-size: 1rem; margin: 10px 0 5px; color: var(--deep); }
        .state { text-align: center; padding: 40px; color: var(--muted); }
    </style>
</head>
<body>
    <header class="bar">
        <a href="library.html">← Back to Digital Library</a>
    </header>

    <main>
        <div id="state" class="state">Loading publisher profile...</div>
        
        <div id="profile-content" class="card" hidden>
            <h1 id="pub-name">Publisher Name</h1>
            <p><strong>Location:</strong> <span id="pub-location"></span></p>
            <p id="pub-desc" style="margin-top: 15px;"></p>
            
            <h3 style="margin-top: 30px; font-family: 'Playfair Display', serif;">Books Published</h3>
            <div id="publisher-books" class="books-grid">
                <!-- Books will load here -->
            </div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://pooatzegjnegutflkcbm.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_i402B2jbhWe_gLBegubEaQ_Nmfpi0vN';
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const $ = id => document.getElementById(id);

        async function loadPublisherProfile() {
            const params = new URLSearchParams(window.location.search);
            const nameParam = params.get('name'); // Publisher name ya slug ke base par load karein

            if (!nameParam) {
                $('state').textContent = 'No publisher specified.';
                return;
            }

            // 1. Fetch Publisher details
            const { data: pubData, error: pubError } = await db
                .from('publishers')
                .select('*')
                .eq('name', decodeURIComponent(nameParam))
                .maybeSingle();

            if (pubError || !pubData) {
                $('state').textContent = 'Publisher profile not found.';
                return;
            }

            $('pub-name').textContent = pubData.name;
            $('pub-location').textContent = pubData.location;
            $('pub-desc').textContent = pubData.description || 'No additional biography or details provided for this publisher yet.';
            document.title = `${pubData.name} | Markaz.org`;

            // 2. Fetch Books associated with this publisher
            const { data: booksData } = await db
                .from('content_items')
                .select('id, slug, cover_image_url, content_translations(language_code, title), book_details!inner(publisher)')
                .eq('status', 'published')
                .eq('book_details.publisher', pubData.name);

            const booksContainer = $('publisher-books');
            booksContainer.innerHTML = '';

            if (!booksData || booksData.length === 0) {
                booksContainer.innerHTML = '<p class="muted">No published books found under this publisher.</p>';
            } else {
                booksData.forEach(item => {
                    const trans = item.content_translations || [];
                    const matched = trans.find(x => x.language_code === 'en') || trans.find(x => x.title) || {};
                    const title = matched.title || item.slug;
                    const cover = item.cover_image_url ? `${SUPABASE_URL}/storage/v1/object/public/book/${item.cover_image_url}` : 'https://via.placeholder.com/200x260?text=No+Cover';

                    const card = document.createElement('a');
                    card.className = 'book-card';
                    card.href = `book-detail.html?slug=${item.slug}`;
                    card.innerHTML = `
                        <img src="${cover}" alt="${title}" loading="lazy">
                        <h4>${title}</h4>
                    `;
                    booksContainer.appendChild(card);
                });
            }

            $('state').hidden = true;
            $('profile-content').hidden = false;
        }

        loadPublisherProfile();
    </script>
</body>
</html>
