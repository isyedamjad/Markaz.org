<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#075e59">
<meta name="description" content="Read poetry, ghazals, naats and literary works in a calm, beautifully typeset reading room at Markaz.org.">
<title>Reading Room | Markaz.org</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&family=Noto+Nastaliq+Urdu:wght@400;500;600&family=Noto+Naskh+Arabic:wght@400;500;600&family=Noto+Serif+Devanagari:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  color-scheme:light;
  --ink:#202124;
  --muted:#72777d;
  --paper:#fff;
  --white:#fff;
  --teal:#075e59;
  --deep:#153b3b;
  --accent:#20b6d8;
  --line:#e9edf0;
  --soft:#f4f7f8;
  --serif:'Playfair Display',Georgia,'Times New Roman',serif;
  --sans:'DM Sans',Arial,sans-serif;
  --reader-size:18px;
}

*{box-sizing:border-box}
html{
  scroll-behavior:smooth;
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font:16px/1.75 var(--sans);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  overflow-wrap:break-word;
}
a{color:var(--teal);text-decoration:none}
button,select{font:inherit}
button{-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible{
  outline:2px solid var(--accent);
  outline-offset:3px;
}

/* Brand/navigation bar */
.mast{
  position:relative;
  z-index:5;
  background:#fff;
  border-bottom:1px solid var(--line);
}
.mast-in{
  width:100%;
  max-width:1180px;
  min-height:76px;
  margin:0 auto;
  padding:13px 28px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:22px;
}
.brand{
  display:inline-block;
  color:var(--deep);
  font:700 1.48rem/1.2 var(--serif);
  white-space:nowrap;
}
.brand small{
  display:block;
  margin-top:5px;
  color:#7a7d80;
  font:600 .66rem/1.35 var(--sans);
  letter-spacing:.16em;
  text-transform:uppercase;
}
.tools{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:9px;
  flex-wrap:wrap;
}
.tools button{
  min-height:39px;
  padding:7px 13px;
  border:1px solid #e7e8e8;
  border-radius:999px;
  background:#fff;
  color:#292d30;
  cursor:pointer;
  transition:border-color .18s ease,background .18s ease;
}
.tools button:hover{border-color:#a8dce6;background:#f8fdfe}
.tools a{
  padding:7px 5px;
  color:#315e60;
  font-size:.92rem;
  white-space:nowrap;
}

/* Main reading column */
.shell{
  width:100%;
  max-width:100%;
  margin:0 auto;
  padding:18px clamp(12px,2.4vw,32px) 54px;
}
.crumb{
  margin:0 0 23px;
  color:#7d8185;
  font-size:.84rem;
  line-height:1.6;
}
.crumb a{color:#777d81}
.crumb a:hover{color:var(--teal)}
.state{
  padding:22px 24px;
  border:1px solid var(--line);
  border-radius:10px;
  background:#fff;
  color:var(--muted);
  overflow-wrap:anywhere;
}
.work-head{
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  padding:7px 0 24px;
  border-bottom:1px solid var(--line);
  text-align:left;
}
.kicker{
  order:3;
  margin-top:12px;
  color:#858b90;
  font:700 .7rem/1.5 var(--sans);
  letter-spacing:.12em;
  text-transform:uppercase;
}
h1{
  order:1;
  width:100%;
  margin:0;
  color:#202124;
  font:700 clamp(1.9rem,4.5vw,2.65rem)/1.25 Georgia,'Times New Roman',serif;
  letter-spacing:-.025em;
  overflow-wrap:anywhere;
}
.byline{
  order:2;
  margin-top:13px;
  color:var(--accent);
  font:700 .91rem/1.65 var(--sans);
  letter-spacing:.15em;
  text-transform:uppercase;
  overflow-wrap:anywhere;
}
.subtitle{
  order:4;
  margin:14px 0 0;
  color:#62686d;
  font:400 1.03rem/1.75 var(--serif);
  overflow-wrap:anywhere;
}
.hidden{display:none!important}

/* Language options: no layout switch; poetry always uses the same layout */
.reader-controls{
  display:flex;
  align-items:center;
  justify-content:flex-start;
  flex-wrap:wrap;
  gap:9px;
  padding:17px 0 13px;
}
.reader-controls button{
  min-height:39px;
  padding:7px 14px;
  border:1px solid #e4e8ea;
  border-radius:999px;
  background:#fff;
  color:#303437;
  font-size:.9rem;
  cursor:pointer;
  transition:background .18s ease,border-color .18s ease,color .18s ease;
}
.reader-controls button:hover{border-color:#a8dce6}
.reader-controls button.active{
  background:#e7f7fa;
  border-color:#b5e7f0;
  color:#0d6678;
}

/* Sufinama-inspired flowing poem: both misras stack naturally */
.poem{
  width:100%;
  max-width:100%;
  min-width:0;
  margin:0;
  padding:24px 0 44px;
  color:#202124;
  font-size:var(--reader-size);
  line-height:1.75;
  overflow-wrap:normal;
  transition:font-size .15s ease;
}
.poem[dir="rtl"]{
  direction:rtl;
  text-align:right;
  font-family:'Noto Nastaliq Urdu','Noto Naskh Arabic',serif;
  font-size:calc(var(--reader-size) + 1px);
  line-height:2.35;
}
.poem[lang="hi"]{
  font-family:'Noto Serif Devanagari','Noto Sans Devanagari',serif;
  font-style:normal;
}
.poem[lang="roman"]{
  font-family:Georgia,'Times New Roman',serif;
  font-style:italic;
  letter-spacing:.012em;
}
.poem[lang="en"]{
  font-family:Georgia,'Times New Roman',serif;
  font-style:normal;
}

/* Each couplet is a calm, open block—not two side-by-side columns */
.poem .couplet{
  display:block;
  width:100%;
  max-width:100%;
  margin:0 0 1.45em;
  padding:0;
  border:0;
}
.poem .misra{
  display:block;
  width:100%;
  min-width:0;
  margin:0;
  padding:0;
  color:inherit;
  text-align:left;
  font-size:1em;
  font-weight:400;
  line-height:1.82;
  white-space:nowrap;
  overflow-wrap:normal;
  word-break:normal;
  hyphens:none;
}
.poem .misra + .misra{margin-top:.08em}
.poem[dir="rtl"] .misra{
  direction:rtl;
  text-align:right;
  font-family:'Noto Nastaliq Urdu','Noto Naskh Arabic',serif;
  line-height:2.3;
}
.poem p{
  margin:0 0 1.45em;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  word-break:normal;
  line-height:1.95;
}
.poem.nazm p{margin-bottom:1.1em}

.translit{
  padding:24px 0;
  border-top:1px solid var(--line);
  color:#656c71;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  font:italic 1.02rem/1.95 Georgia,'Times New Roman',serif;
}
.translit h2{
  margin:0 0 12px;
  color:#292d30;
  font:600 1.1rem/1.4 var(--serif);
}

/* Distraction-free reading */
.reader-mode{background:#fff}
.reader-mode .mast,
.reader-mode .crumb,
.reader-mode .reader-controls,
.reader-mode .footer{display:none}
.reader-mode .shell{max-width:980px;padding-top:25px}
.reader-mode .work-head{padding-top:7px}

.footer{
  padding:23px 16px;
  background:#f7f9fa;
  border-top:1px solid var(--line);
  color:#737a7f;
  text-align:center;
  font-size:.82rem;
}

@media(min-width:900px){
  .poem{max-width:100%;padding-top:28px}
  .poem .couplet{margin-bottom:1.5em}
}
@media(max-width:760px){
  .mast-in{padding:12px 18px;gap:14px}
  .shell{padding:20px 22px 58px}
  .poem{padding:21px 0 36px}
}
@media(max-width:620px){
  .mast-in{align-items:flex-start;flex-direction:column;padding:12px 15px;gap:11px}
  .brand{font-size:1.3rem}
  .brand small{font-size:.62rem}
  .tools{width:100%;justify-content:flex-start;gap:6px}
  .tools button{min-height:36px;padding:6px 10px;font-size:.82rem}
  .tools a{padding:6px 3px;font-size:.84rem}
  .shell{padding:14px 10px 38px}
  .crumb{margin-bottom:17px;font-size:.78rem}
  .work-head{padding:5px 0 20px}
  h1{font-size:clamp(1.45rem,6vw,2rem);line-height:1.28;letter-spacing:-.02em}
  .byline{margin-top:11px;font-size:.8rem;letter-spacing:.13em;line-height:1.7}
  .subtitle{margin-top:11px;font-size:.98rem}
  .kicker{margin-top:9px;font-size:.66rem}
  .reader-controls{gap:7px;padding:14px 0 9px}
  .reader-controls button{min-height:36px;padding:6px 11px;font-size:.83rem}
  .poem{padding:18px 0 28px;font-size:var(--reader-size);line-height:1.75}
  .poem .couplet{margin-bottom:1.05em}
  .poem .misra{line-height:1.65}
  .poem[dir="rtl"]{font-size:calc(var(--reader-size) + 1px);line-height:2}
  .poem[dir="rtl"] .misra{line-height:1.95}
  .translit{padding:19px 0;font-size:.94rem}
}
@media(max-width:380px){
  .shell{padding-left:9px;padding-right:9px}
  .tools{gap:5px}
  .tools button{padding:6px 9px}
  .reader-controls{gap:6px}
  .reader-controls button{padding:6px 9px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *{transition:none!important}
}
</style>
</head>

<body>
<header class="mast">
  <div class="mast-in">
    <a class="brand" href="/home.html">
      Markaz.org
      <small>Poetry · People · Heritage</small>
    </a>
    <nav class="tools" aria-label="Reading room navigation and controls">
      <button id="smaller" type="button" aria-label="Decrease text size">A−</button>
      <button id="larger" type="button" aria-label="Increase text size">A+</button>
      <button id="readerToggle" type="button" aria-pressed="false">Focus reading</button>
      <a href="/poets">Poets</a>
      <a href="/library.html">Library</a>
    </nav>
  </div>
</header>

<main class="shell">
  <nav class="crumb" aria-label="Breadcrumb">
    <a href="/home.html">Home</a> /
    <a href="/poetry.html">Poetry</a> /
    <span id="pageLabel">Poetry</span>
  </nav>

  <div id="loading" class="state" role="status">Opening the reading room…</div>
  <div id="error" class="state hidden" role="alert">This work is unavailable or has not been published.</div>

  <article id="entry" class="hidden">
    <header class="work-head" id="workHead">
      <h1 id="title"></h1>
      <div class="byline" id="byline"></div>
      <p class="subtitle hidden" id="subtitle"></p>
      <div class="kicker" id="type">Literary work</div>
    </header>

    <div class="reader-controls" aria-label="Choose reading language">
      <button type="button" data-lang="ur" aria-pressed="false">اردو</button>
      <button type="button" data-lang="roman" aria-pressed="true">Roman</button>
      <button type="button" data-lang="hi" aria-pressed="false">हिन्दी</button>
    </div>

    <div class="poem" id="body" aria-label="Literary work text"></div>

    <section id="translitWrap" class="translit hidden" aria-labelledby="translitHeading">
      <h2 id="translitHeading">Transliteration</h2>
      <div id="translit"></div>
    </section>
  </article>
</main>

<footer class="footer">Markaz.org · A living archive of literature, Sufi thought and heritage</footer>

<script>
'use strict';

const SUPABASE_URL = 'https://pooatzegjnegutflkcbm.supabase.co';
const SUPABASE_KEY = 'sb_publishable_i402B2jbhWe_gLBegubEaQ_Nmfpi0vN';
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);

let work = null;
let lang = 'roman';
let fontSize = 18;

const VERSE_TYPES = ['ghazal','naat','manqabat','salam','hamd','poetry'];

function esc(value){
  return String(value ?? '').replace(/[&<>"']/g, char => ({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  })[char]);
}

function normalizedType(){
  return String(work?.work_type || '')
    .trim()
    .toLowerCase()
    .replace(/[\s-]+/g, '_');
}

function translation(){
  const translations = work?.author_work_translations || [];
  const selected = translations.find(t => t.language_code === lang && t.body) ||
    translations.find(t => t.language_code === lang && t.title);
  if(selected) return selected;

  return translations.find(t => t.language_code === 'roman' && t.body) ||
    translations.find(t => t.language_code === 'ur' && t.body) ||
    translations.find(t => t.body) ||
    translations.find(t => t.title) || {};
}

/* Blank lines split couplets. Inside a couplet, the first line is misra one;
   any remaining line(s) form misra two. Both misras are displayed vertically. */
function bodyHTML(text){
  if(!text) return '';

  const normalizedText = String(text).replace(/\r\n?/g, '\n').trim();
  if(!normalizedText) return '';

  const isVerse = VERSE_TYPES.includes(normalizedType());
  if(isVerse){
    const blocks = normalizedText.split(/\n\s*\n+/).filter(block => block.trim());
    return blocks.map(block => {
      const lines = block.split('\n').map(line => line.trim()).filter(Boolean);
      if(!lines.length) return '';

      const firstMisra = lines[0];
      const secondMisra = lines.slice(1).join(' ');
      return `<div class="couplet">
        <div class="misra">${esc(firstMisra)}</div>
        ${secondMisra ? `<div class="misra">${esc(secondMisra)}</div>` : ''}
      </div>`;
    }).join('');
  }

  return normalizedText.split(/\n{2,}/).map(paragraph =>
    '<p>' + esc(paragraph.trim()).replace(/\n/g, '<br>') + '</p>'
  ).join('');
}

function updateLanguageControls(){
  document.querySelectorAll('[data-lang]').forEach(button => {
    const active = button.dataset.lang === lang;
    button.classList.toggle('active', active);
    button.setAttribute('aria-pressed', active ? 'true' : 'false');
  });
}

function fitMisras(){
  const poem = $('body');
  if(!poem) return;
  poem.querySelectorAll('.misra').forEach(line => {
    line.style.fontSize = '';
    const base = lang === 'ur' ? fontSize + 1 : fontSize;
    let size = base;
    const minSize = window.innerWidth < 600 ? 12 : 14;
    line.style.fontSize = size + 'px';
    // Keep each misra on a single line, reducing type only as much as needed.
    while(line.scrollWidth > line.clientWidth + 1 && size > minSize){
      size -= 0.5;
      line.style.fontSize = size + 'px';
    }
  });
}

function updateWorkLabel(authorName, workType){
  const type = String(workType || 'poetry').replace(/[_-]+/g, ' ').trim();
  const pretty = type ? type.charAt(0).toUpperCase() + type.slice(1) : 'Poetry';
  $('pageLabel').textContent = authorName ? pretty + ' by ' + authorName : pretty;
}

function render(){
  if(!work) return;

  const t = translation();
  const type = normalizedType();
  const poem = $('body');
  const title = t.title || work.slug || 'Literary work';
  $('title').textContent = title;

  $('subtitle').textContent = t.subtitle || '';
  $('subtitle').classList.toggle('hidden', !t.subtitle);
  $('type').textContent = (work.work_type || 'literary work').replaceAll('_', ' ');

  const translations = work.author_work_translations || [];
  const romanTranslation = translations.find(item =>
    item.language_code === 'roman' && item.transliteration
  );

  const profileTranslations = work.author_profiles?.author_profile_translations || [];
  const person = profileTranslations.find(item => item.language_code === lang) ||
    profileTranslations.find(item => item.language_code === 'roman') ||
    profileTranslations[0] || {};

  const authorName = person.display_name ||
    work.author_profiles?.real_name ||
    work.author_profiles?.pen_name || '';
  const year = work.publication_year ? String(work.publication_year) : '';
  $('byline').textContent = [authorName, year].filter(Boolean).join(' · ');
  $('byline').classList.toggle('hidden', !$('byline').textContent.trim());
  updateWorkLabel(authorName, work.work_type);

  poem.innerHTML = bodyHTML(t.body || t.excerpt || '');

  const isUrdu = lang === 'ur';
  poem.dir = isUrdu ? 'rtl' : 'ltr';
  poem.lang = lang;
  $('workHead').dir = isUrdu ? 'rtl' : 'ltr';
  $('workHead').style.textAlign = isUrdu ? 'right' : 'left';

  poem.classList.toggle('ghazal', type === 'ghazal');
  poem.classList.toggle('naat', type === 'naat');
  poem.classList.toggle('manqabat', type === 'manqabat');
  poem.classList.toggle('salam', type === 'salam');
  poem.classList.toggle('hamd', type === 'hamd');
  poem.classList.toggle('poetry', VERSE_TYPES.includes(type));
  poem.classList.toggle('nazm', type === 'nazm');
  poem.style.setProperty('--reader-size', fontSize + 'px');
  requestAnimationFrame(fitMisras);

  document.documentElement.lang = isUrdu ? 'ur' : (lang === 'hi' ? 'hi' : 'en');
  updateLanguageControls();

  if(romanTranslation){
    $('translit').textContent = romanTranslation.transliteration;
    $('translitWrap').classList.remove('hidden');
  }else{
    $('translit').textContent = '';
    $('translitWrap').classList.add('hidden');
  }

  document.title = title + ' | Markaz.org';
}

async function load(){
  const params = new URLSearchParams(window.location.search);
  const slug = (params.get('slug') || '').trim();

  if(!slug){
    $('loading').classList.add('hidden');
    $('error').classList.remove('hidden');
    return;
  }

  try{
    const { data, error } = await db
      .from('author_works')
      .select('*,author_work_translations(*),author_profiles(slug,real_name,pen_name,profile_type,author_profile_translations(language_code,display_name))')
      .eq('slug', slug)
      .eq('status', 'published')
      .maybeSingle();

    $('loading').classList.add('hidden');
    if(error) throw error;
    if(!data) throw new Error('Work not found or not published.');

    work = data;
    $('entry').classList.remove('hidden');
    render();
  }catch(error){
    console.error('Could not load literary work:', error);
    $('loading').classList.add('hidden');
    $('entry').classList.add('hidden');
    $('error').classList.remove('hidden');
  }
}

/* Language switching */
document.querySelectorAll('[data-lang]').forEach(button => {
  button.addEventListener('click', () => {
    lang = button.dataset.lang;
    render();
  });
});

/* Font-size controls */
$('smaller').addEventListener('click', () => {
  fontSize = Math.max(14, fontSize - 2);
  render();
});
$('larger').addEventListener('click', () => {
  fontSize = Math.min(28, fontSize + 2);
  render();
});

window.addEventListener('resize', () => requestAnimationFrame(fitMisras));

/* Focus reading */
$('readerToggle').addEventListener('click', () => {
  const enabled = document.body.classList.toggle('reader-mode');
  $('readerToggle').textContent = enabled ? 'Exit focus reading' : 'Focus reading';
  $('readerToggle').setAttribute('aria-pressed', enabled ? 'true' : 'false');
});

load();
</script>
</body>
</html>
