<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#075e59">
<meta name="description" content="Read poetry, ghazals and literary works in a calm, premium reading experience.">
<title>Reading Room | Markaz.org</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&family=Noto+Nastaliq+Urdu:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--ink:#19282b;--muted:#647174;--paper:#fbfaf6;--white:#fff;--teal:#075e59;--deep:#064743;--gold:#ad7d35;--line:#dfe6e1;--serif:'Playfair Display',Georgia,serif;--sans:'DM Sans',Arial,sans-serif;--reader-size:22px;--reader-gap:1.65}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.8 var(--sans);-webkit-font-smoothing:antialiased}a{color:var(--teal);text-decoration:none}.mast{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:4}.mast-in{max-width:1120px;margin:auto;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font:700 1.3rem var(--serif);color:var(--deep)}.brand small{display:block;font:600 .65rem var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.tools button,.tools select{border:1px solid var(--line);border-radius:999px;background:#fff;padding:8px 12px;color:var(--ink);cursor:pointer}.tools button:hover{border-color:var(--teal)}.shell{max-width:980px;margin:0 auto;padding:28px 22px 90px}.crumb{font-size:.82rem;color:var(--muted);margin-bottom:26px}.state{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px;color:var(--muted)}.work-head{text-align:center;padding:26px 10px 30px;border-bottom:1px solid var(--line)}.kicker{font-size:.72rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--teal)}h1{font:600 clamp(2rem,5vw,3.5rem)/1.2 var(--serif);letter-spacing:-.035em;margin:12px 0;color:var(--deep)}.subtitle{color:var(--muted);font:1.08rem/1.7 var(--serif);margin:0}.byline{font-size:.85rem;color:var(--muted);margin-top:14px}.reader-controls{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;padding:18px 0}.reader-controls button{border:1px solid var(--line);border-radius:999px;background:#fff;padding:7px 13px;color:var(--ink);cursor:pointer}.reader-controls button.active{background:#e5f0ec;border-color:#bfd7ce;color:var(--deep)}.poem{max-width:850px;margin:0 auto;padding:22px 10px 50px;font-size:var(--reader-size);line-height:var(--reader-gap);transition:font-size .15s}.poem[dir=rtl]{font-family:'Noto Nastaliq Urdu',serif;text-align:right;font-size:calc(var(--reader-size) + 3px);line-height:2.15}.poem p{margin:0 0 1.4em;white-space:pre-wrap;overflow-wrap:anywhere}.poem.ghazal .couplet{display:grid;grid-template-columns:1fr 1fr;gap:clamp(20px,5vw,70px);align-items:start;margin:0 auto 2.25em;max-width:850px}.poem.ghazal .misra{white-space:pre-wrap;text-align:center;line-height:var(--reader-gap);overflow-wrap:anywhere}.poem.ghazal[dir=rtl] .couplet{direction:rtl}.poem.ghazal[dir=rtl] .misra{font-family:'Noto Nastaliq Urdu',serif;line-height:2.25}.poem.nazm p{margin-bottom:.85em}.translit{border-top:1px solid var(--line);padding:24px 10px;color:var(--muted);white-space:pre-wrap;line-height:1.9}.translit h2{font:600 1.1rem var(--serif);color:var(--ink)}.footer{text-align:center;background:#102c2b;color:#dce9e2;padding:24px;font-size:.8rem}.hidden{display:none!important}.reader-mode .mast,.reader-mode .crumb,.reader-mode .reader-controls,.reader-mode .footer{display:none}.reader-mode .shell{max-width:900px;padding-top:28px}.reader-mode .work-head{padding-top:10px}@media(max-width:620px){.mast-in{align-items:flex-start;flex-direction:column;padding:12px 16px}.shell{padding:22px 15px 60px}.poem{padding-left:0;padding-right:0}.poem.ghazal .couplet{gap:14px;font-size:.9em;margin-bottom:2em}.tools{width:100%}.tools button{padding:7px 10px}}
</style>
</head>
<body>
<header class="mast"><div class="mast-in"><a class="brand" href="/home.html">Markaz.org<small>Poetry · People · Heritage</small></a><div class="tools"><button id="smaller" aria-label="Decrease text size">A−</button><button id="larger" aria-label="Increase text size">A+</button><button id="readerToggle">Focus reading</button><a href="/poets">Poets</a><a href="/library.html">Library</a></div></div></header>
<main class="shell"><div class="crumb"><a href="/home.html">Home</a> / <a href="/poetry.html">Poetry</a> / Reading room</div><div id="loading" class="state">Opening the reading room…</div><div id="error" class="state hidden">This work is unavailable or has not been published.</div>
<article id="entry" class="hidden"><header class="work-head"><div class="kicker" id="type">Literary work</div><h1 id="title"></h1><p class="subtitle" id="subtitle"></p><div class="byline" id="byline"></div></header>
<div class="reader-controls" aria-label="Reading options"><button data-lang="ur">اردو</button><button data-lang="roman">Roman</button><button data-lang="hi">हिन्दी</button><button data-lang="en">English</button><button id="layoutToggle">Couplet layout</button></div>
<div class="poem" id="body"></div><section id="translitWrap" class="translit hidden"><h2>Transliteration</h2><div id="translit"></div></section></article></main>
<footer class="footer">Markaz.org · A living archive of literature, Sufi thought and heritage</footer>
<script>
const SUPABASE_URL='https://pooatzegjnegutflkcbm.supabase.co',SUPABASE_KEY='sb_publishable_i402B2jbhWe_gLBegubEaQ_Nmfpi0vN';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY),$=id=>document.getElementById(id);
let work=null,lang='roman',fontSize=22,layout='auto';
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function translation(){const ts=work?.author_work_translations||[];return ts.find(t=>t.language_code===lang&&t.body)||ts.find(t=>t.language_code===lang&&t.title)||ts.find(t=>t.language_code==='roman'&&t.body)||ts.find(t=>t.language_code==='en'&&t.body)||ts[0]||{};}
function bodyHTML(text){if(!text)return '';const isGhazal=(work.work_type||'').toLowerCase()==='ghazal';if(isGhazal&&layout!=='plain'){const blocks=text.trim().split(/\n\s*\n/);return blocks.map(b=>{const lines=b.split(/\n/).filter(Boolean);if(lines.length>=2)return '<div class="couplet"><div class="misra">'+esc(lines[0])+'</div><div class="misra">'+esc(lines.slice(1).join('\n'))+'</div></div>';return '<div class="couplet"><div class="misra">'+esc(lines[0]||'')+'</div><div class="misra"></div></div>';}).join('');}return text.split(/\n{2,}/).map(p=>'<p>'+esc(p).replace(/\n/g,'<br>')+'</p>').join('');}
function render(){const t=translation();$('title').textContent=t.title||work.slug;$('subtitle').textContent=t.subtitle||'';$('subtitle').classList.toggle('hidden',!t.subtitle);$('type').textContent=(work.work_type||'literary work').replaceAll('_',' ');$('byline').textContent=work.publication_year?'Published '+work.publication_year:'';$('body').innerHTML=bodyHTML(t.body||t.excerpt||'');$('body').dir=lang==='ur'?'rtl':'ltr';$('body').classList.toggle('ghazal',(work.work_type||'').toLowerCase()==='ghazal');$('body').classList.toggle('nazm',(work.work_type||'').toLowerCase()==='nazm');$('body').style.setProperty('--reader-size',fontSize+'px');document.documentElement.lang=lang==='hi'?'hi':'en';document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));const tr=(work.author_work_translations||[]).find(x=>x.language_code==='roman'&&x.transliteration);if(tr){$('translit').textContent=tr.transliteration;$('translitWrap').classList.remove('hidden')}else $('translitWrap').classList.add('hidden');document.title=(t.title||work.slug)+' | Markaz.org';}
async function load(){const slug=new URLSearchParams(location.search).get('slug');if(!slug){$('loading').classList.add('hidden');$('error').classList.remove('hidden');return;}const {data,error}=await db.from('author_works').select('*,author_work_translations(*),author_profiles(slug,real_name,pen_name,profile_type,author_profile_translations(language_code,display_name))').eq('slug',slug).eq('status','published').maybeSingle();$('loading').classList.add('hidden');if(error||!data){console.error(error);$('error').classList.remove('hidden');return;}work=data;$('entry').classList.remove('hidden');const pt=data.author_profiles?.author_profile_translations||[];const person=pt.find(x=>x.language_code===lang)||pt.find(x=>x.language_code==='en');$('byline').textContent=(person?.display_name||data.author_profiles?.real_name||data.author_profiles?.pen_name||'')+(data.publication_year?' · '+data.publication_year:'');render();}
document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.lang;if(work)render();}));
$('smaller').onclick=()=>{fontSize=Math.max(16,fontSize-2);if(work)render();};$('larger').onclick=()=>{fontSize=Math.min(34,fontSize+2);if(work)render();};
$('readerToggle').onclick=()=>{document.body.classList.toggle('reader-mode');$('readerToggle').textContent=document.body.classList.contains('reader-mode')?'Exit focus reading':'Focus reading';};
$('layoutToggle').onclick=()=>{layout=layout==='plain'?'auto':'plain';$('layoutToggle').classList.toggle('active',layout==='auto');if(work)render();};
load();
</script></body></html>
