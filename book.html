<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#075e59">
    <title>Book Detail | Markaz.org</title>
    
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --ink: #17272b;
            --muted: #657275;
            --paper: #f7f8f5;
            --teal: #075e59;
            --deep: #064743;
            --gold: #b58a48;
            --line: #dce4df;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--paper);
            color: var(--ink);
            font: 16px/1.7 'DM Sans', sans-serif;
        }
        .bar {
            position: sticky;
            top: 0;
            z-index: 3;
            background: #fff;
            border-bottom: 1px solid var(--line);
        }
        .barin {
            max-width: 1200px;
            margin: auto;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }
        .brand {
            font: 700 1.25rem 'Playfair Display', serif;
            color: var(--deep);
            text-decoration: none;
        }
        .tools {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .tools a {
            border: 1px solid var(--line);
            border-radius: 99px;
            padding: 8px 16px;
            background: #fff;
            color: var(--ink);
            text-decoration: none;
            font-size: 0.9rem;
        }
        main {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .detail-card {
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 30px;
            display: flex;
            gap: 40px;
            align-items: flex-start;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
        }
        .cover-box {
            flex: 0 0 260px;
            background: #e9eeea;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--line);
            aspect-ratio: 3/4;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .cover-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .info-box {
            flex: 1;
        }
        h1 {
            font: 600 clamp(1.8rem, 3vw, 2.5rem)/1.2 'Playfair Display', serif;
            margin: 0 0 15px 0;
            color: var(--deep);
        }
        .meta-list {
            list-style: none;
            padding: 0;
            margin: 0 0 25px 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .meta-list li {
            font-size: 0.95rem;
            color: var(--muted);
        }
        .meta-list li strong {
            color: var(--ink);
        }
        .meta-list a {
            color: var(--teal);
            text-decoration: none;
            font-weight: 600;
        }
        .meta-list a:hover {
            text-decoration: underline;
            color: var(--deep);
        }
        .actions {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .btn-read {
            background: var(--teal);
            color: #fff;
            padding: 12px 28px;
            border-radius: 99px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.05rem;
            transition: background 0.2s;
            display: inline-block;
        }
        .btn-read:hover {
            background: var(--deep);
        }
        .state {
            text-align: center;
            padding: 40px;
            color: var(--muted);
            background: #fff;
            border-radius: 12px;
            border: 1px solid var(--line);
        }
        @media(max-width: 768px) {
            .detail-card {
                flex-direction: column;
                padding: 20px;
                gap: 20px;
            }
            .cover-box {
                width: 100%;
                max-width: 220px;
                margin: 0 auto;
            }
        }
    </style>

<body>
    <header class="bar">
        <div class="barin">
            <a class="brand" href="/library.html">Markaz.org · Digital Library</a>
            <div class="tools">
                <a href="/library.html">Library</a>
                <a href="/home.html">Home</a>
            </div>
        </div>
    </header>

    <main>
        <div id="state" class="state">Loading book details...</div>
        
        <div id="book-content" class="detail-card" hidden>
            <div class="cover-box">
                <img id="cover" src="" alt="Book Cover">
            </div>
            <div class="info-box">
                <h1 id="title">Book Title</h1>
                
                <ul id="meta-list" class="meta-list">
                    <!-- Dynamic details will inject here -->
                </ul>
                
                <div class="actions">
                    <a id="read-btn" class="btn-read" href="#">Read Now</a>
                </div>
            </div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://pooatzegjnegutflkcbm.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_i402B2jbhWe_gLBegubEaQ_Nmfpi0vN';
        
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const $ = id => document.getElementById(id);

        function fileUrl(path, bucket = 'book') {
            if (!path) return '';
            if (/^https?:\/\//i.test(path)) return path;
            const cleanPath = path.startsWith('/') ? path.slice(1) : path;
            return `${SUPABASE_URL}/storage/v1/object/public/${bucket}/${cleanPath}`;
        }

        const BOOK_LANGUAGES = ['en', 'hi', 'ur'];
        const BOOK_MESSAGES = {
            en: { noBook: 'No book selected.', notFound: 'Book not found or unavailable.', unavailable: 'This book title is not available in the selected language.', noCover: 'No cover available', readNow: 'Read Now' },
            hi: { noBook: 'कोई पुस्तक चयनित नहीं है।', notFound: 'पुस्तक नहीं मिली या उपलब्ध नहीं है।', unavailable: 'इस भाषा में पुस्तक का शीर्षक उपलब्ध नहीं है।', noCover: 'कवर उपलब्ध नहीं', readNow: 'अभी पढ़ें' },
            ur: { noBook: 'کوئی کتاب منتخب نہیں کی گئی۔', notFound: 'کتاب نہیں ملی یا دستیاب نہیں ہے۔', unavailable: 'منتخب زبان میں اس کتاب کا عنوان دستیاب نہیں۔', noCover: 'سرورق دستیاب نہیں', readNow: 'ابھی پڑھیں' }
        };
        function selectedBookLanguage() {
            try {
                const value = localStorage.getItem('markaz_site_language');
                return BOOK_LANGUAGES.includes(value) ? value : 'en';
            } catch (_) { return 'en'; }
        }
        function selectedTranslation(rows, field = 'title') {
            const language = selectedBookLanguage();
            return (rows || []).find(row => row.language_code === language && row[field] && String(row[field]).trim()) || null;
        }

        async function loadDetail() {
            const params = new URLSearchParams(window.location.search);
            const slug = params.get('slug');

            if (!slug) {
                $('state').textContent = BOOK_MESSAGES[selectedBookLanguage()].noBook;
                return;
            }

            // Simple robust query matching book-reader.html style
            const { data, error } = await db
                .from('content_items')
                .select('id, slug, cover_image_url, content_translations(language_code, title), book_details(*)')
                .eq('slug', slug)
                .eq('status', 'published')
                .maybeSingle();

            if (error || !data) {
                $('state').textContent = BOOK_MESSAGES[selectedBookLanguage()].notFound;
                return;
            }

            const details = Array.isArray(data.book_details) ? data.book_details[0] : (data.book_details || {});
            const translations = data.content_translations || [];
            const matched = selectedTranslation(translations);
            const title = matched ? matched.title : BOOK_MESSAGES[selectedBookLanguage()].unavailable;

            $('title').textContent = title;
            
            // Cover Image setup
            if (data.cover_image_url) {
                $('cover').src = fileUrl(data.cover_image_url, 'book');
            } else {
                $('cover').removeAttribute('src');
                $('cover').alt = BOOK_MESSAGES[selectedBookLanguage()].noCover;
            }

            // Safely fetch author name and text slug using author_id
            let authorName = '';
            let authorSlug = '';
            const currentLanguage = selectedBookLanguage();

            if (details.author_id) {
                const { data: personData } = await db
                    .from('people')
                    .select('verified_name, content_id')
                    .eq('content_id', details.author_id)
                    .maybeSingle();

                if (personData) {
                    const { data: authorTranslations } = await db
                        .from('content_translations')
                        .select('language_code, title')
                        .eq('content_id', personData.content_id)
                        .eq('language_code', currentLanguage);
                    const localizedAuthor = selectedTranslation(authorTranslations);
                    if (localizedAuthor) authorName = localizedAuthor.title;

                    const { data: itemData } = await db
                        .from('content_items')
                        .select('slug')
                        .eq('id', personData.content_id)
                        .maybeSingle();

                    if (itemData) authorSlug = itemData.slug;
                }
            }

            // Legacy free-text author fields have no language metadata, so only show them in English.
            if (!details.author_id && currentLanguage === 'en') {
                authorName = details.author || details.writer || '';
            }

            // Dynamic fields generation
            const metaContainer = $('meta-list');
            metaContainer.innerHTML = '';

            const fieldsList = [
                { key: 'author', label: 'Author', value: authorName, isAuthorLink: true, authorSlug: authorSlug },
                { key: 'translator', label: 'Translator', value: details.translator },
                { key: 'editor', label: 'Editor', value: details.editor },
                { key: 'publisher', label: 'Publisher', value: details.publisher, isPublisherLink: true },
                { key: 'page_count', label: 'Page counts', value: details.page_count || details.pages },
                { key: 'publication_year', label: 'Publication year', value: details.publication_year || details.year, isYearLink: true },
                { key: 'edition', label: 'Edition', value: details.edition },
                { key: 'language', label: 'Language', value: details.language_original || details.language, isLangLink: true },
                { key: 'notes', label: 'Notes', value: details.notes || details.description }
            ];

            fieldsList.forEach(item => {
                if (item.value && String(item.value).trim() !== '') {
                    const li = document.createElement('li');
                    
                    if (item.isPublisherLink) {
                        const pubUrl = `publisher.html?name=${encodeURIComponent(item.value)}`;
                        li.innerHTML = `<strong>${item.label}:</strong> <a href="${pubUrl}">${item.value}</a>`;
                    } else if (item.isAuthorLink && item.authorSlug) {
                        const authorUrl = `authors.html?slug=${encodeURIComponent(item.authorSlug)}`;
                        li.innerHTML = `<strong>${item.label}:</strong> <a href="${authorUrl}">${item.value}</a>`;
                    } else if (item.isYearLink) {
                        const yearUrl = `library.html?year=${encodeURIComponent(item.value)}`;
                        li.innerHTML = `<strong>${item.label}:</strong> <a href="${yearUrl}">${item.value}</a>`;
                    } else if (item.isLangLink) {
                        const langUrl = `library.html?lang=${encodeURIComponent(item.value)}`;
                        li.innerHTML = `<strong>${item.label}:</strong> <a href="${langUrl}">${item.value}</a>`;
                    } else {
                        li.innerHTML = `<strong>${item.label}:</strong> ${item.value}`;
                    }
                    
                    metaContainer.appendChild(li);
                }
            });

            // Read Now button link pointing to reader page with slug
            $('read-btn').href = `book-reader.html?slug=${encodeURIComponent(slug)}`;
            $('read-btn').textContent = BOOK_MESSAGES[selectedBookLanguage()].readNow;
            $('read-btn').hidden = !matched;
            $('state').hidden = true;
            $('book-content').hidden = false;
            document.title = `${title} | Markaz.org`;
            document.dispatchEvent(new CustomEvent('markaz:refresh-language'));
        }

        loadDetail();
    </script>

<script id="markaz-offline-language-script">
(function(){

function getLang(){try{var l=localStorage.getItem(KEY);return allowed.indexOf(l)>=0?l:'en'}catch(e){return 'en'}}
function saveLang(l){try{localStorage.setItem(KEY,l)}catch(e){}}
function norm(s){return (s||'').replace(/\s+/g,' ').trim()}
function original(el){if(!el.dataset.markazOriginal){el.dataset.markazOriginal=el.textContent}return el.dataset.markazOriginal}
function translateTextNode(node,lang){
 var p=node.parentElement;if(!p||p.closest('script,style,noscript,textarea,code,pre,input,select,option,[contenteditable="true"],#markaz-global-language'))return;
 if(node.__markazOriginal===undefined)node.__markazOriginal=node.nodeValue;
 var raw=node.__markazOriginal, key=norm(raw); if(!key)return;
 var hit=dict[key]; if(hit){var val=lang==='hi'?hit[0]:lang==='ur'?hit[1]:key;
   if(raw.trim()===raw)node.nodeValue=val;
   else {var lead=raw.match(/^\s*/)[0],trail=raw.match(/\s*$/)[0];node.nodeValue=lead+val+trail;}
 } else {node.nodeValue=raw;}
}
function apply(lang){
 if(allowed.indexOf(lang)<0)lang='en';saveLang(lang);
 document.documentElement.lang=lang;document.documentElement.dir=lang==='ur'?'rtl':'ltr';
 document.body.classList.toggle('markaz-urdu',lang==='ur');
 document.querySelectorAll('[data-en],[data-hi],[data-ur]').forEach(function(el){
   var v=el.getAttribute('data-'+lang);
   if(v!==null){if(el.matches('input,textarea'))el.placeholder=v;else if(el.children.length===0)el.textContent=v;}
 });
 document.querySelectorAll('[data-en-html]').forEach(function(el){var v=el.getAttribute('data-'+lang+'-html')||el.getAttribute('data-en-html');if(v!==null)el.innerHTML=v});
 var walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT),nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
 nodes.forEach(function(n){translateTextNode(n,lang)});
 document.querySelectorAll('input[placeholder],textarea[placeholder]').forEach(function(el){
   if(!el.dataset.markazPlaceholder)el.dataset.markazPlaceholder=el.placeholder;
   var key=norm(el.dataset.markazPlaceholder),hit=dict[key];if(hit)el.placeholder=lang==='hi'?hit[0]:lang==='ur'?hit[1]:el.dataset.markazPlaceholder;
 });
 document.querySelectorAll('#markaz-global-language button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.markazLang===lang?'true':'false')});
}
function addSwitcher(){
 if(document.getElementById('markaz-global-language'))return;
 var box=document.createElement('div');box.id='markaz-global-language';box.setAttribute('aria-label','Website language');
 box.innerHTML='<span>भाषा / زبان</span><button type="button" data-markaz-lang="en">EN</button><button type="button" data-markaz-lang="hi">हिन्दी</button><button type="button" data-markaz-lang="ur">اردو</button>';
 document.body.appendChild(box);
 box.addEventListener('click',function(e){var b=e.target.closest('button[data-markaz-lang]');if(!b)return;apply(b.dataset.markazLang)});
}
function start(){addSwitcher();apply(getLang());}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
