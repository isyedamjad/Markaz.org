
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#651c2c">
<title>Book Details | Sufi Adab Archive</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600&family=Noto+Nastaliq+Urdu:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--wine:#651c2c;--dark:#48121f;--gold:#b18a48;--paper:#fbf8f1;--white:#fffefa;--ink:#30251f;--muted:#766b61;--border:#e5d9c8}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px "DM Sans",sans-serif;line-height:1.8}
header{background:var(--white);border-bottom:1px solid var(--border)}nav,.wrap{max-width:1050px;margin:auto;padding:16px 22px}nav{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}nav a{color:var(--wine);text-decoration:none;font-weight:600}
.languages{display:flex;gap:5px}.languages button{border:1px solid var(--border);background:#f3ecdf;border-radius:5px;padding:5px 9px;cursor:pointer}.languages button.active{background:var(--wine);color:white}
.back{display:inline-block;margin:25px 0;color:var(--wine);text-decoration:none;font-weight:700}
.panel{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:clamp(20px,4vw,40px);box-shadow:0 8px 25px #41231d0a}
.book-head{display:grid;grid-template-columns:220px 1fr;gap:32px;align-items:start}
.cover{min-height:260px;background:#f1e7d7;border:1px solid var(--border);border-radius:8px;display:grid;place-items:center;padding:15px;text-align:center;color:var(--wine);overflow:hidden}
.cover img{width:100%;max-height:340px;object-fit:contain}
h1,h2{font-family:"Playfair Display",serif;color:var(--dark);line-height:1.4}
h1{font-size:clamp(30px,5vw,46px);margin:0 0 7px;overflow-wrap:anywhere}
.subname{font-size:17px;color:var(--muted);margin:0 0 15px}
.kicker{font-size:11px;text-transform:uppercase;letter-spacing:2px;color:var(--gold);font-weight:700}
.about{white-space:pre-wrap;overflow-wrap:anywhere}
.metadata{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 25px;margin-top:30px;border-top:1px solid var(--border)}
.field{padding:14px 0;border-bottom:1px solid var(--border);min-width:0}
.label{display:block;color:var(--muted);font-size:12px;margin-bottom:3px}
.value{font-weight:600;overflow-wrap:anywhere}
.related a{color:var(--wine)}
.state{padding:35px;text-align:center;color:var(--muted)}
footer{margin-top:45px;background:var(--dark);color:#f4e9da;padding:25px;text-align:center}
@media(max-width:650px){.book-head{grid-template-columns:1fr;gap:20px}.cover{min-height:200px}.cover img{max-height:280px}.metadata{grid-template-columns:1fr}nav,.wrap{padding:13px 15px}}
</style>
</head>
<body>
<header><nav>
<a href="home.html">Sufi Adab Archive</a>
<div><a href="library.html" id="backNav">← Library</a> &nbsp;·&nbsp; <a href="home.html" id="homeNav">Home</a></div>
<div class="languages"><button data-lang="en" class="active">EN</button><button data-lang="hi">हि</button><button data-lang="ur">اردو</button></div>
</nav></header>
<main class="wrap">
<a class="back" href="library.html" id="backLink">← Back to Library</a>
<div id="content" class="panel"><div class="state">Loading book details…</div></div>
</main>
<footer>Sufi Adab Archive · Preserving literature, history and heritage.</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://pooatzegjnegutflkcbm.supabase.co";
const SUPABASE_KEY="sb_publishable_i402B2jbhWe_gLBegubEaQ_Nmfpi0vN";
const labels={
en:{back:"← Back to Library",author:"Author",translator:"Translator",year:"Year of Publication",publisher:"Publisher",language:"Language",pages:"Pages",edition:"Edition",origin:"Origin",genre:"Genre",contributor:"Contributor",about:"About the Book",subname:"Book sub name",missing:"Not provided",error:"Book not found or it is not published."},
hi:{back:"← पुस्तकालय में वापस जाएँ",author:"लेखक",translator:"अनुवादक",year:"प्रकाशन वर्ष",publisher:"प्रकाशक",language:"भाषा",pages:"पृष्ठ",edition:"संस्करण",origin:"मूल स्थान",genre:"विधा",contributor:"योगदानकर्ता",about:"पुस्तक के बारे में",subname:"पुस्तक का उपशीर्षक",missing:"जानकारी उपलब्ध नहीं",error:"पुस्तक नहीं मिली या प्रकाशित नहीं है।"},
ur:{back:"← کتب خانے میں واپس جائیں",author:"مصنف",translator:"مترجم",year:"سنِ اشاعت",publisher:"ناشر",language:"زبان",pages:"صفحات",edition:"ایڈیشن",origin:"اصل مقام",genre:"صنف",contributor:"معاون",about:"کتاب کے بارے میں",subname:"کتاب کا ذیلی عنوان",missing:"معلومات موجود نہیں",error:"کتاب نہیں ملی یا شائع نہیں ہوئی۔"}
};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const params=new URLSearchParams(location.search);const slug=params.get("slug");let lang=params.get("lang")||"en";let bookRecord=null;
function normalized(s){return String(s||"").toLowerCase()==="roman"?"en":String(s||"").toLowerCase();}
function meta(r){return Array.isArray(r.book_details)?r.book_details[0]||{}:r.book_details||{};}
function tr(r){const a=r.content_translations||[];return a.find(x=>normalized(x.language_code)===lang)||a.find(x=>normalized(x.language_code)==="en")||a[0]||{};}
function val(v){return v===null||v===undefined||String(v).trim()===""?labels[lang].missing:String(v);}
function field(k,v){return `<div class="field"><span class="label">${esc(labels[lang][k])}</span><div class="value">${esc(val(v))}</div></div>`;}
function render(){
 if(!bookRecord){document.getElementById("content").innerHTML=`<div class="state">${esc(labels[lang].error)}</div>`;return;}
 const t=tr(bookRecord),m=meta(bookRecord);
 const title=t.title||bookRecord.slug;
 const cover=bookRecord.cover_url||bookRecord.image_url||bookRecord.cover_image_url||"";
 const coverHtml=cover?`<img src="${esc(cover)}" alt="${esc(title)}" onerror="this.style.display='none'">`:`<div>${esc(title)}</div>`;
 const about=m.about_book||t.body||t.excerpt||"";
 const details=[
 ["author",m.author_name],["translator",m.translator_name],["year",m.publication_year],
 ["publisher",m.publisher_name],["language",m.language_name],["pages",m.pages],
 ["edition",m.edition],["origin",m.origin],["genre",m.genre_name],["contributor",m.contributor_name]
 ];
 document.documentElement.lang=lang;document.documentElement.dir=lang==="ur"?"rtl":"ltr";
 document.getElementById("backLink").textContent=labels[lang].back;
 document.getElementById("backNav").textContent=labels[lang].back;
 document.getElementById("homeNav").textContent=lang==="ur"?"صفحۂ اوّل":lang==="hi"?"मुखपृष्ठ":"Home";
 document.getElementById("content").innerHTML=`
 <div class="book-head"><div class="cover">${coverHtml}</div><div>
 <div class="kicker">Sufi Adab Archive · Digital Library</div>
 <h1>${esc(title)}</h1>
 <p class="subname">${esc(m.book_subname||t.subtitle||"")}</p>
 <h2>${esc(labels[lang].about)}</h2>
 <div class="about">${esc(about||labels[lang].missing)}</div>
 </div></div>
 <div class="metadata">
 ${details.map(([k,v])=>field(k,v)).join("")}
 ${field("subname",m.book_subname)}
 </div>`;
}
async function init(){
 document.getElementById("backLink").textContent=labels[lang]?.back||labels.en.back;
 try{
  if(!slug)throw new Error("Missing slug");
  const client=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  const {data,error}=await client.from("content_items")
   .select("id,type,slug,status,content_translations(language_code,title,subtitle,excerpt,body,transliteration),book_details(*)")
   .eq("type","book").eq("status","published").eq("slug",slug).maybeSingle();
  if(error)throw error;
  bookRecord=data;
 }catch(e){console.error(e);}
 render();
}
document.querySelectorAll("[data-lang]").forEach(b=>b.addEventListener("click",()=>{lang=b.dataset.lang;document.querySelectorAll("[data-lang]").forEach(x=>x.classList.toggle("active",x.dataset.lang===lang));render();}));
init();
</script>
</body>
</html>
