<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#472127"><title>Author Profile | Markaz.org</title><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Noto+Nastaliq+Urdu&display=swap" rel="stylesheet"><style>:root{--wine:#651c2c;--deep:#472127;--gold:#b58a48;--paper:#fffdf8;--cream:#f7f1e8;--ink:#292321;--muted:#746b65;--line:#e8ddd0}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.65 system-ui,sans-serif}.top{background:var(--deep);color:white;padding:18px max(5vw,18px);display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}.brand{font:700 25px 'Playfair Display',serif;color:#fff;text-decoration:none}.top a{color:#fff}.langs{display:flex;gap:7px}button,select{font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px 11px;background:var(--paper);cursor:pointer}.langs button.active{background:var(--gold);color:#fff}.wrap{max-width:1100px;margin:28px auto;padding:0 18px}.hero,.section,.works{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:24px;margin-bottom:18px}.hero{display:grid;grid-template-columns:190px 1fr;gap:25px;align-items:start}.portrait{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:12px;background:#eee1d0}.eyebrow{color:var(--gold);letter-spacing:2px;font-size:12px;font-weight:800;text-transform:uppercase}.name{font:700 clamp(27px,4vw,42px) 'Playfair Display',serif;color:var(--deep);margin:5px 0}.muted{color:var(--muted)}.facts{display:flex;flex-wrap:wrap;gap:10px 22px;margin:15px 0}.fact{min-width:130px}.fact b{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tabs a{padding:8px 12px;border-radius:99px;border:1px solid var(--line);color:var(--wine);text-decoration:none}.section h2,.works h2{font:700 25px 'Playfair Display',serif;color:var(--deep);margin-top:0}.workgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.work{border:1px solid var(--line);border-radius:10px;padding:14px}.work h3{margin:0;color:var(--wine)}.empty{color:var(--muted);padding:20px;text-align:center}.rtl{direction:rtl;font-family:'Noto Nastaliq Urdu',serif}.footer{text-align:center;color:var(--muted);padding:25px}@media(max-width:620px){.hero{grid-template-columns:100px 1fr;padding:15px;gap:14px}.section,.works{padding:17px}.name{font-size:25px}.fact{min-width:100px}}</style></head><body><header class="top"><a class="brand" href="home.html">Markaz.org</a><div class="langs"><button data-lang="en" class="active">English</button><button data-lang="hi">हिन्दी</button><button data-lang="ur">اردو</button></div></header><main class="wrap"><div id="status" class="section">Loading profile…</div><div id="content" hidden></div></main><footer class="footer">A Sanctuary of Sufi Literature, Scholarship and Spiritual Heritage.</footer><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const db=createClient('https://pooatzegjnegutflkcbm.supabase.co','sb_publishable_i402B2jbhWe_gLBegubEaQ_Nmfpi0vN');let lang=localStorage.getItem('markaz-lang')||'en',profile,translations=[],works=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const pick=(rows,l)=>rows.find(x=>x.language_code===l)||rows.find(x=>x.language_code==='en')||rows[0]||{};function render(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ur'?'rtl':'ltr';document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));let t=pick(translations,lang);let loc=(id)=>{let x=profile?.[id+'_location'];return x?(lang==='ur'?x.name_ur:lang==='hi'?x.name_hi:x.name_en)||x.name_en||'—':'—'};document.getElementById('status').hidden=true;let c=document.getElementById('content');c.hidden=false;c.innerHTML=`<section class="hero"><img class="portrait" src="${esc(profile.profile_image_url||'https://placehold.co/500x650/f0e4d8/651c2c?text=Markaz.org')}" alt="${esc(t.display_name||profile.pen_name||profile.real_name)}"><div><div class="eyebrow">${lang==='ur'?'سوانح و کلام':lang==='hi'?'जीवन परिचय और रचनाएँ':'Author & Poet Profile'}</div><h1 class="name">${esc(t.display_name||profile.pen_name||profile.real_name||profile.slug)}</h1><div class="muted">${esc(t.real_name||profile.real_name||'')}${t.pen_name||profile.pen_name?' · '+esc(t.pen_name||profile.pen_name):''}</div><p>${esc(t.short_bio||'')}</p><div class="facts"><div class="fact"><b>${lang==='ur'?'پیدائش':lang==='hi'?'जन्म':'Born'}</b>${esc(profile.birth_date||'—')}<br>${esc(loc('birth'))}</div><div class="fact"><b>${lang==='ur'?'وفات':lang==='hi'?'मृत्यु':'Died'}</b>${esc(profile.death_date||'—')}<br>${esc(loc('death'))}</div></div></div></section><nav class="tabs"><a href="#biography">${lang==='ur'?'سوانح':lang==='hi'?'जीवनी':'Biography'}</a><a href="#works">${lang==='ur'?'تصانیف و کلام':lang==='hi'?'रचनाएँ':'Works'}</a></nav><section id="biography" class="section"><h2>${lang==='ur'?'تفصیلی سوانح':lang==='hi'?'विस्तृत जीवनी':'Biography'}</h2><div>${(t.biography||'').replace(/
/g,'<br>')||'<p class="muted">Biography will appear here when added by an editor.</p>'}</div>${t.life_and_legacy?`<h2>${lang==='ur'?'علمی و روحانی وراثت':lang==='hi'?'विरासत':'Legacy'}</h2><div>${esc(t.life_and_legacy)}</div>`:''}</section><section id="works" class="works"><h2>${lang==='ur'?'کلام، کتابیں اور متعلقہ مواد':lang==='hi'?'कलाम, पुस्तकें और संबंधित सामग्री':'Poetry, Books & Related Works'}</h2><div class="workgrid">${works.map(w=>{let x=pick(w.author_work_translations||[],lang);return `<article class="work"><div class="eyebrow">${esc(w.work_type)}</div><h3>${esc(x.title||w.slug)}</h3>${x.excerpt?`<p>${esc(x.excerpt)}</p>`:''}<details><summary>${lang==='ur'?'متن پڑھیں':lang==='hi'?'पाठ पढ़ें':'Read text'}</summary><div class="${x.script_direction==='rtl'?'rtl':''}">${esc(x.body||'').replace(/
/g,'<br>')}</div>${x.transliteration?`<p>${esc(x.transliteration)}</p>`:''}</details></article>`}).join('')||'<div class="empty">No published works yet.</div>'}</div></section>`}document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.lang;localStorage.setItem('markaz-lang',lang);render()}));const slug=new URLSearchParams(location.search).get('slug')||location.pathname.split('/').filter(Boolean).pop();try{const r=await db.from('author_profiles').select('*,birth_location:author_locations!author_profiles_birth_location_fk(*),death_location:author_locations!author_profiles_death_location_fk(*)').eq('slug',slug).eq('status','published').maybeSingle();if(r.error)throw r.error;if(!r.data)throw Error('Profile not found or not published.');profile=r.data;const [tr,wr]=await Promise.all([db.from('author_profile_translations').select('*').eq('profile_id',profile.id),db.from('author_works').select('*,author_work_translations(*)').eq('profile_id',profile.id).eq('status','published').order('created_at',{ascending:false})]);if(tr.error)throw tr.error;if(wr.error)throw wr.error;translations=tr.data||[];works=wr.data||[];document.title=(pick(translations,lang).display_name||profile.pen_name||profile.real_name)+' | Markaz.org';render()}catch(e){document.getElementById('status').textContent=e.message+' — check the SQL migration and published profile status.'}</script></body></html>
