<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#075e59">
    <title>Book Reader | Markaz.org</title>
    
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- PDF.js Library for rendering PDF pages dynamically -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
    
    <style>
        :root {
            --ink: #17272b;
            --muted: #657275;
            --paper: #181818;
            --teal: #075e59;
            --deep: #064743;
            --gold: #b58a48;
            --line: #333;
        }
        * { box-sizing: border-box; touch-action: manipulation; }
        body {
            margin: 0;
            background: var(--paper);
            color: #fff;
            font-family: 'DM Sans', sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        
        /* Top Navigation Header */
        .bar {
            background: #111;
            border-bottom: 1px solid var(--line);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            z-index: 10;
            height: 52px;
        }
        .brand {
            font: 700 1rem 'Playfair Display', serif;
            color: #fff;
            text-decoration: none;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .top-tools a {
            border: 1px solid #444;
            border-radius: 6px;
            padding: 5px 12px;
            background: #2a2a2a;
            color: #fff;
            text-decoration: none;
            font-size: 0.8rem;
        }

        /* Main Reader Viewer Box */
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: auto;
            position: relative;
            background: #222;
            padding: 10px;
        }
        #canvas-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            overflow: auto;
        }
        canvas {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            box-shadow: 0 8px 30px rgba(0,0,0,0.8);
            background: #fff;
            border-radius: 4px;
        }
        .state {
            color: #ccc;
            text-align: center;
            font-size: 1rem;
            padding: 20px;
        }

        /* Bottom Control Bar for Page Changing */
        .bottom-bar {
            background: #111;
            border-top: 1px solid var(--line);
            padding: 8px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            z-index: 10;
            height: 60px;
        }
        .btn-page {
            border: 1px solid #444;
            border-radius: 6px;
            padding: 8px 16px;
            background: var(--teal);
            color: #fff;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        .btn-page:disabled {
            background: #333;
            color: #777;
            border-color: #333;
            cursor: not-allowed;
        }
        
        /* Dynamic Page Number Input */
        .page-input-box {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            color: #ccc;
        }
        .page-input-box input {
            width: 50px;
            text-align: center;
            background: #222;
            border: 1px solid #444;
            color: #fff;
            padding: 5px;
            border-radius: 4px;
            font-size: 0.9rem;
            font-weight: 600;
        }
        .page-input-box input:focus {
            border-color: var(--gold);
            outline: none;
        }

        @media(max-width: 480px) {
            .btn-page {
                padding: 8px 10px;
                font-size: 0.8rem;
            }
            .page-input-box {
                font-size: 0.8rem;
            }
            .page-input-box input {
                width: 42px;
            }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="bar">
        <a class="brand" href="/library.html" id="book-title">Loading Reader...</a>
        <div class="top-tools">
            <a href="/library.html">Close</a>
        </div>
    </header>

    <!-- Main PDF Display Surface -->
    <main id="main-viewer">
        <div id="state" class="state">Fetching book pages, please wait...</div>
        <div id="canvas-container" hidden>
            <canvas id="pdf-render"></canvas>
        </div>
    </main>

    <!-- Bottom Dynamic Navigation Controls -->
    <footer class="bottom-bar">
        <button id="prev-btn" class="btn-page" disabled>◀ Previous</button>
        
        <div class="page-input-box">
            <span>Page</span>
            <input type="number" id="page-num-input" min="1" value="1">
            <span>of <span id="page-count">--</span></span>
        </div>
        
        <button id="next-btn" class="btn-page" disabled>Next ▶</button>
    </footer>

    <script>
        const SUPABASE_URL = 'https://pooatzegjnegutflkcbm.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_i402B2jbhWe_gLBegubEaQ_Nmfpi0vN';
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const $ = id => document.getElementById(id);

        let pdfDoc = null,
            pageNum = 1,
            pageRendering = false,
            pageNumPending = null,
            scale = 1.5,
            canvas = $('pdf-render'),
            ctx = canvas.getContext('2d');

        function getFileUrl(path) {
            if (!path) return '';
            if (/^https?:\/\//i.test(path)) return path;
            const cleanPath = path.startsWith('/') ? path.slice(1) : path;
            return `${SUPABASE_URL}/storage/v1/object/public/book/${cleanPath}`;
        }

        function renderPage(num) {
            pageRendering = true;
            pdfDoc.getPage(num).then(page => {
                const viewport = page.getViewport({ scale: scale });
                canvas.height = viewport.height;
                canvas.width = viewport.width;

                const renderContext = {
                    canvasContext: ctx,
                    viewport: viewport
                };
                const renderTask = page.render(renderContext);

                renderTask.promise.then(() => {
                    pageRendering = false;
                    if (pageNumPending !== null) {
                        renderPage(pageNumPending);
                        pageNumPending = null;
                    }
                });
            });

            $('page-num-input').value = num;
            $('prev-btn').disabled = (num <= 1);$('next-btn').disabled = (num >= pdfDoc.numPages);
        }

        function queueRenderPage(num) {
            if (pageRendering) {
                pageNumPending = num;
            } else {
                renderPage(num);
            }
        }

        function onPrevPage() {
            if (pageNum <= 1) return;
            pageNum--;
            queueRenderPage(pageNum);
        }

        function onNextPage() {
            if (pageNum >= pdfDoc.numPages) return;
            pageNum++;
            queueRenderPage(pageNum);
        }

        // Button Listeners
        $('prev-btn').addEventListener('click', onPrevPage);$('next-btn').addEventListener('click', onNextPage);

        // Dynamic Page Input Change Listener (Direct Page Jump)
        $('page-num-input').addEventListener('change', (e) => {
            let targetPage = parseInt(e.target.value);
            if (isNaN(targetPage) || targetPage < 1) targetPage = 1;
            if (targetPage > pdfDoc.numPages) targetPage = pdfDoc.numPages;
            pageNum = targetPage;
            queueRenderPage(pageNum);
        });

        // Touch Swipe Navigation for Mobile Screens (Left & Right Touch Slide)
        let touchstartX = 0;
        let touchendX = 0;
        
        const mainViewer = $('main-viewer');

        mainViewer.addEventListener('touchstart', e => {
            touchstartX = e.changedTouches[0].screenX;
        }, { passive: true });

        mainViewer.addEventListener('touchend', e => {
            touchendX = e.changedTouches[0].screenX;
            handleSwipe();
        }, { passive: true });

        function handleSwipe() {
            const swipeDistance = touchendX - touchstartX;
            if (Math.abs(swipeDistance) > 40) { // Threshold 40px
                if (swipeDistance < 0) {
                    onNextPage(); // Left swipe -> Next page
                } else {
                    onPrevPage(); // Right swipe -> Previous page
                }
            }
        }

        // Fetch PDF and Render via Blob ArrayBuffer (Bypasses CORS issues)
        async function loadReader() {
            try {
                const params = new URLSearchParams(window.location.search);
                const slug = params.get('slug');

                if (!slug) {
                    $('state').textContent = 'No book selected.';
                    return;
                }

                const { data, error } = await db
                    .from('content_items')
                    .select('id, slug, content_translations(language_code, title), book_details(*)')
                    .eq('slug', slug)
                    .eq('status', 'published')
                    .maybeSingle();

                if (error || !data) {
                    $('state').textContent = 'Book unavailable or not found.';
                    return;
                }

                const details = Array.isArray(data.book_details) ? data.book_details[0] : data.book_details;
                const path = details?.pdf_storage_path || details?.epub_storage_path;

                if (!path) {
                    $('state').textContent = 'No digital PDF attached to this book.';
                    return;
                }

                const translations = data.content_translations || [];
                const matchedTranslation = translations.find(x => x.language_code === 'en') || translations.find(x => x.title) || {};
                $('book-title').textContent = matchedTranslation.title || data.slug;

                const pdfUrl = getFileUrl(path);

                // Fetch PDF as Blob/ArrayBuffer to avoid browser iframe/open card block
                const response = await fetch(pdfUrl);
                if (!response.ok) throw new Error('Network response was not ok');
                const arrayBuffer = await response.arrayBuffer();

                pdfjsLib.getDocument({ data: arrayBuffer }).promise.then(pdfDoc_ => {
                    pdfDoc = pdfDoc_;
                    $('page-count').textContent = pdfDoc.numPages;
                    $('page-num-input').max = pdfDoc.numPages;

                    $('state').hidden = true;
                    $('canvas-container').hidden = false;

                    renderPage(pageNum);
                }).catch(err => {
                    console.error('PDF JS load error:', err);
                    $('state').textContent = 'Failed to load PDF pages.';
                });

            } catch (err) {
                console.error(err);
                $('state').textContent = 'Error loading PDF file. Please check internet connection.';
            }
        }

        loadReader();
    </script>
</body>
</html>
