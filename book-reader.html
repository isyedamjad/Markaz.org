<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#075e59">
    <title>Book Reader | Markaz.org</title>
    
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --ink: #17272b;
            --muted: #657275;
            --paper: #f7f8f5;
            --teal: #075e59;
            --deep: #064743;
            --gold: #b58a48;
            --line: #dce4df;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--paper);
            color: var(--ink);
            font: 16px/1.7 'DM Sans', sans-serif;
        }
        .bar {
            position: sticky;
            top: 0;
            z-index: 3;
            background: #fff;
            border-bottom: 1px solid var(--line);
        }
        .barin {
            max-width: 1200px;
            margin: auto;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }
        .brand {
            font: 700 1.25rem 'Playfair Display', serif;
            color: var(--deep);
            text-decoration: none;
        }
        .tools {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .tools a, .tools button {
            border: 1px solid var(--line);
            border-radius: 99px;
            padding: 8px 13px;
            background: #fff;
            color: var(--ink);
            text-decoration: none;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .tools .primary {
            background: var(--teal);
            color: #fff;
            border-color: var(--teal);
        }
        main {
            max-width: 950px;
            margin: auto;
            padding: 24px 20px 70px;
        }
        .meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }
        h1 {
            font: 600 clamp(1.4rem, 3vw, 2.2rem)/1.2 'Playfair Display', serif;
            margin: 0;
            color: var(--deep);
        }
        .by {
            color: var(--muted);
            font-size: .9rem;
            margin-top: 4px;
        }
        .frame {
            height: calc(100vh - 190px);
            min-height: 600px;
            background: #222;
            border: 1px solid var(--line);
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .frame iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #fff;
        }
        .state {
            padding: 24px;
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 14px;
            color: var(--muted);
            text-align: center;
        }
        body.focus .bar, body.focus .meta {
            display: none;
        }
        body.focus main {
            max-width: 100%;
            padding: 10px;
        }
        body.focus .frame {
            height: calc(100vh - 20px);
        }
        @media(max-width: 600px) {
            .frame {
                height: calc(100vh - 160px);
                min-height: 480px;
            }
            main {
                padding: 12px 10px 40px;
            }
        }
    </style>
</head>
<body>
    <header class="bar">
        <div class="barin">
            <a class="brand" href="/library.html">Markaz.org · Digital Library</a>
            <div class="tools">
                <button id="focus" type="button">Focus reading</button>
                <a href="/library.html">Library</a>
                <a href="/home.html">Home</a>
            </div>
        </div>
    </header>

    <main>
        <div id="state" class="state">Preparing your book reader…</div>
        
        <section id="book" hidden>
            <div class="meta">
                <div>
                    <h1 id="title">Book</h1>
                    <div id="by" class="by"></div>
                </div>
            </div>
            
            <div class="frame" id="viewer-container">
                <!-- PDF iframe yahan inject hoga -->
            </div>
        </section>
    </main>

    <script>
        const SUPABASE_URL = 'https://pooatzegjnegutflkcbm.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_i402B2jbhWe_gLBegubEaQ_Nmfpi0vN';
        
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const $ = id => document.getElementById(id);

        function fileUrl(path, bucket = 'book') {
            if (!path) return '';
            if (/^https?:\/\//i.test(path)) return path;
            const cleanPath = path.startsWith('/') ? path.slice(1) : path;
            return `${SUPABASE_URL}/storage/v1/object/public/${bucket}/${cleanPath}`;
        }

        async function load() {
            try {
                const params = new URLSearchParams(window.location.search);
                const slug = params.get('slug');

                if (!slug) {
                    $('state').textContent = 'No book was selected.';
                    return;
                }

                const { data, error } = await db
                    .from('content_items')
                    .select('id, slug, content_translations(language_code, title), book_details(*)')
                    .eq('slug', slug)
                    .eq('status', 'published')
                    .maybeSingle();

                if (error || !data) {
                    $('state').textContent = 'Book not found or unavailable.';
                    return;
                }

                const details = Array.isArray(data.book_details) ? data.book_details[0] : data.book_details;
                const path = details?.pdf_storage_path || details?.epub_storage_path;
                const url = fileUrl(path, 'book');

                if (!url) {
                    $('state').textContent = 'No PDF or EPUB edition has been attached to this book yet.';
                    return;
                }

                const translations = data.content_translations || [];
                const matchedTranslation = translations.find(x => x.language_code === 'en') || translations.find(x => x.title) || {};
                const title = matchedTranslation.title || data.slug;

                $('title').textContent = title;
                $('by').textContent = details?.publisher ? `Publisher: ${details.publisher}` : '';

                // **Iframe ke zariye PDF ko usi box ke andar load karna**
                $('viewer-container').innerHTML = `<iframe src="${url}#view=FitH"></iframe>`;

                $('state').hidden = true;
                $('book').hidden = false;
                document.title = `${title} | Markaz.org`;

            } catch (err) {
                console.error('Error:', err);
                $('state').textContent = 'An unexpected error occurred while loading the book.';
            }
        }

        $('focus').onclick = () => {
            document.body.classList.toggle('focus');
            $('focus').textContent = document.body.classList.contains('focus') ? 'Exit focus' : 'Focus reading';
        };

        load();
    </script>
</body>
</html>
