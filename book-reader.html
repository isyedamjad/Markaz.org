<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#111111">
    <title>Book Reader | Markaz.org</title>
    
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
    
    <style>
        :root {
            --paper: #1e1e1e;
            --bar-bg: rgba(20, 20, 20, 0.95);
            --accent: #b58a48;
            --text-main: #f0f0f0;
            --line: #333;
        }
        * { box-sizing: border-box; touch-action: manipulation; }
        body {
            margin: 0;
            background: var(--paper);
            color: var(--text-main);
            font-family: 'DM Sans', sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        
        .top-bar {
            background: var(--bar-bg);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--line);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 10;
            height: 50px;
        }
        .brand {
            font: 600 0.95rem 'Playfair Display', serif;
            color: #fff;
            text-decoration: none;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 75%;
        }
        .close-btn {
            background: #2a2a2a;
            border: 1px solid #444;
            color: #ccc;
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            text-decoration: none;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: auto;
            position: relative;
            background: #161616;
            padding: 0;
        }
        #canvas-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            overflow: auto;
            padding: 10px;
        }
        canvas {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            box-shadow: 0 5px 25px rgba(0,0,0,0.6);
            background: #fff;
            border-radius: 2px;
        }
        iframe.pdf-embed {
            width: 100%;
            height: 100%;
            border: none;
            background: #fff;
        }
        .state {
            color: #aaa;
            text-align: center;
            font-size: 0.95rem;
            padding: 20px;
        }

        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(26, 26, 26, 0.92);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
            z-index: 100;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.4);
            height: 64px;
        }
        .tool-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .circle-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }
        .circle-btn:hover:not(:disabled) {
            background: var(--accent);
            border-color: var(--accent);
            color: #111;
        }
        .circle-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        .page-indicator {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 0.9rem;
            color: #ddd;
            font-weight: 600;
        }
        .page-indicator span.sub {
            font-size: 0.7rem;
            color: #888;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body>

    <header class="top-bar">
        <a class="brand" href="library.html" id="book-title">Loading...</a>
        <a class="close-btn" href="library.html">Close</a>
    </header>

    <main id="main-viewer">
        <div id="state" class="state">Preparing book viewer...</div>
        <div id="canvas-container" hidden>
            <canvas id="pdf-render"></canvas>
        </div>
    </main>

    <footer class="bottom-bar" id="bottom-controls">
        <div class="tool-group">
            <button id="zoom-out" class="circle-btn" title="Zoom Out">−</button>
            <button id="zoom-in" class="circle-btn" title="Zoom In">+</button>
        </div>

        <div class="page-indicator">
            <div><span id="page-num">1</span> / <span id="page-count">--</span></div>
            <span class="sub">Page</span>
        </div>

        <div class="tool-group">
            <button id="prev-btn" class="circle-btn" disabled title="Previous Page">‹</button>
            <button id="next-btn" class="circle-btn" disabled title="Next Page">›</button>
        </div>
    </footer>

    <script>
        const SUPABASE_URL = 'https://pooatzegjnegutflkcbm.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_i402B2jbhWe_gLBegubEaQ_Nmfpi0vN';
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const $ = id => document.getElementById(id);

        let pdfDoc = null,
            pageNum = 1,
            pageRendering = false,
            pageNumPending = null,
            scale = 1.3,
            canvas = $('pdf-render'),
            ctx = canvas.getContext('2d');

        function rawUrl(path) {
            if (!path) return '';
            if (/^https?:\/\//i.test(path)) return path;
            const cleanPath = path.startsWith('/') ? path.slice(1) : path;
            return `${SUPABASE_URL}/storage/v1/object/public/book/${cleanPath}`;
        }

        function renderPage(num) {
            if (!pdfDoc) return;
            pageRendering = true;
            pdfDoc.getPage(num).then(page => {
                const viewport = page.getViewport({ scale: scale });
                canvas.height = viewport.height;
                canvas.width = viewport.width;

                const renderContext = { canvasContext: ctx, viewport: viewport };
                const renderTask = page.render(renderContext);

                renderTask.promise.then(() => {
                    pageRendering = false;
                    if (pageNumPending !== null) {
                        renderPage(pageNumPending);
                        pageNumPending = null;
                    }
                });
            });

            $('page-num').textContent = num;
            $('prev-btn').disabled = (num <= 1);$('next-btn').disabled = (num >= pdfDoc.numPages);
        }

        function queueRenderPage(num) {
            if (pageRendering) {
                pageNumPending = num;
            } else {
                renderPage(num);
            }
        }

        function onPrevPage() {
            if (pageNum <= 1) return;
            pageNum--;
            queueRenderPage(pageNum);
        }

        function onNextPage() {
            if (!pdfDoc || pageNum >= pdfDoc.numPages) return;
            pageNum++;
            queueRenderPage(pageNum);
        }

        $('prev-btn').addEventListener('click', onPrevPage);$('next-btn').addEventListener('click', onNextPage);

        $('zoom-in').addEventListener('click', () => {
            scale += 0.25;
            if (scale > 2.5) scale = 2.5;
            renderPage(pageNum);
        });

        $('zoom-out').addEventListener('click', () => {
            scale -= 0.25;
            if (scale < 0.8) scale = 0.8;
            renderPage(pageNum);
        });

        // Touch Swipe
        let touchstartX = 0, touchendX = 0;
        const mainViewer = $('main-viewer');
        mainViewer.addEventListener('touchstart', e => { touchstartX = e.changedTouches[0].screenX; }, { passive: true });
        mainViewer.addEventListener('touchend', e => {
            touchendX = e.changedTouches[0].screenX;
            const dist = touchendX - touchstartX;
            if (Math.abs(dist) > 40) {
                if (dist < 0) onNextPage();
                else onPrevPage();
            }
        }, { passive: true });

        // Direct Embed Fallback for heavy Internet Archive Links
        function embedDirectViewer(url) {
            $('state').hidden = true;
            $('bottom-controls').hidden = true; // Native viewer has its own controls$('main-viewer').innerHTML = `<iframe class="pdf-embed" src="${url}#toolbar=1&navpanes=0"></iframe>`;
        }

        async function loadReader() {
            try {
                const params = new URLSearchParams(window.location.search);
                const slug = params.get('slug');

                if (!slug) {
                    $('state').textContent = 'No book selected.';
                    return;
                }

                const { data, error } = await db
                    .from('content_items')
                    .select('id, slug, content_translations(language_code, title), book_details(*)')
                    .eq('slug', slug)
                    .eq('status', 'published')
                    .maybeSingle();

                if (error || !data) {
                    $('state').textContent = 'Book unavailable or not found.';
                    return;
                }

                const details = Array.isArray(data.book_details) ? data.book_details[0] : data.book_details;
                const path = details?.pdf_storage_path || details?.epub_storage_path;

                if (!path) {
                    $('state').textContent = 'No digital PDF attached to this book.';
                    return;
                }

                const translations = data.content_translations || [];
                const matchedTranslation = translations.find(x => x.language_code === 'en') || translations.find(x => x.title) || {};
                $('book-title').textContent = matchedTranslation.title || data.slug;

                const targetUrl = rawUrl(path);

                // Check if external link (Internet Archive)
                if (/^https?:\/\//i.test(path)) {
                    // Try PDF.js direct streaming with 4-second timeout limit
                    let loaded = false;
                    const timeout = setTimeout(() => {
                        if (!loaded) {
                            console.warn("Direct stream timeout, switching to native embed...");
                            embedDirectViewer(targetUrl);
                        }
                    }, 3500);

                    pdfjsLib.getDocument({ url: targetUrl, withCredentials: false }).promise.then(pdfDoc_ => {
                        loaded = true;
                        clearTimeout(timeout);
                        pdfDoc = pdfDoc_;
                        $('page-count').textContent = pdfDoc.numPages;
                        $('state').hidden = true;
                        $('canvas-container').hidden = false;
                        renderPage(pageNum);
                    }).catch(err => {
                        clearTimeout(timeout);
                        console.warn("PDF.js stream blocked, rendering direct embed:", err);
                        embedDirectViewer(targetUrl);
                    });
                } else {
                    // Internal Supabase Path
                    pdfjsLib.getDocument(targetUrl).promise.then(pdfDoc_ => {
                        pdfDoc = pdfDoc_;
                        $('page-count').textContent = pdfDoc.numPages;
                        $('state').hidden = true;
                        $('canvas-container').hidden = false;
                        renderPage(pageNum);
                    }).catch(err => {
                        $('state').textContent = 'Error loading PDF storage path.';
                    });
                }

            } catch (err) {
                console.error(err);
                $('state').textContent = 'Error loading book reader.';
            }
        }

        loadReader();
    </script>
</body>
</html>
