    <style>

    </style>

<style>html[dir="rtl"] .top-bar,html[dir="rtl"] .bottom-bar{direction:rtl}html[dir="rtl"] .info-head{direction:rtl}html[dir="rtl"] .info-description{text-align:right}</style>
</head>
<body>

    <header class="top-bar">
        <div class="header-meta">
            <a class="brand" href="#" id="book-title">Loading...</a>
            <div class="author-name" id="book-author">By: Markaz Library</div>
        </div>
        <div class="header-actions">
          <button class="header-btn" type="button" id="info-open" aria-haspopup="dialog" aria-controls="book-info-modal"><span aria-hidden="true">ⓘ</span> <span id="info-button-label">Info</span></button>
          <a class="header-btn close-btn" href="library.html" id="close-link">Close</a>
        </div>
    </header>

    <main id="main-viewer">
        <div id="state" class="state">
            <div class="spinner"></div>
            <span id="state-text">Book loading...</span>
        </div>
        <div id="canvas-container">
            <canvas id="pdf-render"></canvas>
        </div>
    </main>

    <footer class="bottom-bar" id="bottom-controls">
        <div class="tool-group">
            <button id="zoom-out" class="circle-btn" title="Zoom Out">−</button>
            <button id="zoom-in" class="circle-btn" title="Zoom In" aria-label="Zoom in">+</button>
            <span class="zoom-label" id="zoom-label">100%</span>
            <button id="zoom-fit" class="circle-btn" title="Fit page" aria-label="Fit page">↗</button>
        </div>

        <div class="page-input-container">
            <div class="page-input-wrapper">
                <input type="number" id="page-input" min="1" value="1" aria-label="Page Number">
                <span>/ <span id="page-count">--</span></span>
            </div>
            <span class="sub">PAGE</span>
        </div>

        <div class="tool-group">
            <button id="prev-btn" class="circle-btn" disabled title="Previous Page">‹</button>
            <button id="next-btn" class="circle-btn" disabled title="Next Page">›</button>
        </div>
    </footer>

    <div class="modal-backdrop" id="book-info-modal" role="dialog" aria-modal="true" aria-labelledby="info-title">
      <section class="info-panel">
        <div class="info-head"><div><div class="info-kicker">Markaz.org · Reading room</div><h2 id="info-title">Book information</h2></div><button class="icon-close" id="info-close" type="button" aria-label="Close information">×</button></div>
        <p class="info-description" id="info-description" hidden></p><div class="info-grid" id="info-grid"></div><div class="info-empty" id="info-empty" hidden>Additional information has not been provided for this book.</div>
      </section>
    </div>

      const T=labels[lang]||labels.en;
      function setText(id,value){$(id).textContent=value}

      function firstValue(obj,keys){for(const key of keys){const v=obj?.[key];if(v!==undefined&&v!==null&&String(v).trim()!=='')return v}return ''}
      function renderInfo(){

      document.documentElement.lang=lang;document.documentElement.dir=lang==='ur'?'rtl':'ltr';setText('info-button-label',T.info);setText('state-text',T.loading);loadReader();
