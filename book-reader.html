<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#075e59"><title>Book Reader | Markaz.org"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--ink:#17272b;--muted:#657275;--paper:#f7f8f5;--teal:#075e59;--deep:#064743;--gold:#b58a48;--line:#dce4df}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.7 'DM Sans',sans-serif}.bar{position:sticky;top:0;z-index:3;background:#fff;border-bottom:1px solid var(--line)}.barin{max-width:1200px;margin:auto;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:15px}.brand{font:700 1.25rem 'Playfair Display',serif;color:var(--deep);text-decoration:none}.tools{display:flex;gap:8px;flex-wrap:wrap}.tools a,.tools button{border:1px solid var(--line);border-radius:99px;padding:8px 13px;background:#fff;color:var(--ink);text-decoration:none;cursor:pointer}.tools .primary{background:var(--teal);color:#fff;border-color:var(--teal)}main{max-width:1200px;margin:auto;padding:24px 20px 70px}.meta{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;margin-bottom:16px}h1{font:600 clamp(1.5rem,3vw,2.5rem)/1.2 'Playfair Display',serif;margin:0;color:var(--deep)}.by{color:var(--muted);font-size:.9rem}.frame{height:calc(100vh - 210px);min-height:540px;background:#e9eeea;border:1px solid var(--line);border-radius:14px;overflow:hidden}.frame iframe{width:100%;height:100%;border:0;background:#fff}.state{padding:24px;background:#fff;border:1px solid var(--line);border-radius:14px;color:var(--muted)}body.focus .bar,body.focus .meta,body.focus .note{display:none}body.focus main{max-width:1500px;padding-top:12px}.note{font-size:.82rem;color:var(--muted);margin-top:12px}@media(max-width:600px){.barin{align-items:flex-start;flex-direction:column}.frame{height:calc(100vh - 240px);min-height:450px}main{padding:18px 12px 40px}}
</style></head><body><header class="bar"><div class="barin"><a class="brand" href="/library.html">Markaz.org · Digital Library</a><div class="tools"><button id="focus">Focus reading</button><a href="/library.html">Library</a><a href="/home.html">Home</a></div></div></header><main><div id="state" class="state">Preparing your book…</div><section id="book" hidden><div class="meta"><div><h1 id="title">Book</h1><div id="by" class="by"></div></div><div class="tools"><a id="download" class="primary" href="#" target="_blank" rel="noopener">Open original file</a></div></div><div class="frame"><iframe id="viewer" title="Book reading viewer" allow="fullscreen"></iframe></div><p class="note">The digital edition opens in your browser's document viewer. If your device cannot display it, use “Open original file”. Availability depends on the uploaded edition.</p></section></main><script>
const URL='https://pooatzegjnegutflkcbm.supabase.co',KEY='sb_publishable_i402B2jbhWe_gLBegubEaQ_Nmfpi0vN',db=window.supabase.createClient(URL,KEY),$=id=>document.getElementById(id);
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fileUrl(path,bucket){if(!path)return '';if(/^https?:\/\//i.test(path))return path;return URL+'/storage/v1/object/public/'+bucket+'/'+path.split('/').map(encodeURIComponent).join('/');}
async function load(){const slug=new URLSearchParams(location.search).get('slug');if(!slug){$('state').textContent='No book was selected. Return to the digital library.';return;}const {data,error}=await db.from('content_items').select('id,slug,cover_image_url,content_translations(language_code,title),book_details(*)').eq('slug',slug).eq('status','published').maybeSingle();if(error||!data){$('state').textContent='This book could not be found or is not published.';return;}const d=Array.isArray(data.book_details)?data.book_details[0]:data.book_details;const path=d?.pdf_storage_path||d?.epub_storage_path;const url=fileUrl(path,'book');if(!url){$('state').textContent='No PDF or EPUB edition has been attached to this book yet.';return;}const tr=data.content_translations||[];const title=(tr.find(x=>x.language_code==='en')||tr.find(x=>x.title)||{}).title||data.slug;$('title').textContent=title;$('by').textContent=d?.publisher||'';$('download').href=url;$('viewer').src=(String(path).toLowerCase().endsWith('.pdf')||d?.pdf_storage_path)?url+'#toolbar=1&navpanes=0&view=FitH':url;$('state').hidden=true;$('book').hidden=false;document.title=title+' | Markaz.org';}
$('focus').onclick=()=>{document.body.classList.toggle('focus');$('focus').textContent=document.body.classList.contains('focus')?'Exit focus':'Focus reading';};load();
</script></body></html>
