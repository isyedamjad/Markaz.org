<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#075e59">
    <title>Book Reader | Markaz.org</title>
    
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --ink: #17272b;
            --muted: #657275;
            --paper: #f7f8f5;
            --teal: #075e59;
            --deep: #064743;
            --line: #dce4df;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: #1e1e1e;
            color: #fff;
            font: 16px/1.7 'DM Sans', sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        .bar {
            background: #111;
            border-bottom: 1px solid #333;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            z-index: 10;
        }
        .brand {
            font: 700 1.1rem 'Playfair Display', serif;
            color: #fff;
            text-decoration: none;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .controls a {
            border: 1px solid #444;
            border-radius: 6px;
            padding: 6px 14px;
            background: #2a2a2a;
            color: #fff;
            text-decoration: none;
            cursor: pointer;
            font-size: 0.85rem;
        }
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            background: #2b2b2b;
        }
        iframe, object {
            width: 100%;
            height: 100%;
            border: none;
            background: #fff;
        }
        .state {
            color: #bbb;
            text-align: center;
            font-size: 1rem;
            padding: 20px;
        }
    </style>
</head>
<body>

    <header class="bar">
        <a class="brand" href="/library.html" id="book-title">Markaz Library</a>
        <div class="controls">
            <a href="/library.html">Close / Library</a>
        </div>
    </header>

    <main id="main-viewer">
        <div id="state" class="state">Loading book reader...</div>
    </main>

    <script>
        const SUPABASE_URL = 'https://pooatzegjnegutflkcbm.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_i402B2jbhWe_gLBegubEaQ_Nmfpi0vN';
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const $ = id => document.getElementById(id);

        function getFileUrl(path) {
            if (!path) return '';
            if (/^https?:\/\//i.test(path)) return path;
            const cleanPath = path.startsWith('/') ? path.slice(1) : path;
            return `${SUPABASE_URL}/storage/v1/object/public/book/${cleanPath}`;
        }

        async function loadReader() {
            try {
                const params = new URLSearchParams(window.location.search);
                const slug = params.get('slug');

                if (!slug) {
                    $('state').textContent = 'No book selected.';
                    return;
                }

                const { data, error } = await db
                    .from('content_items')
                    .select('id, slug, content_translations(language_code, title), book_details(*)')
                    .eq('slug', slug)
                    .eq('status', 'published')
                    .maybeSingle();

                if (error || !data) {
                    $('state').textContent = 'Book unavailable or not found.';
                    return;
                }

                const details = Array.isArray(data.book_details) ? data.book_details[0] : data.book_details;
                const path = details?.pdf_storage_path || details?.epub_storage_path;

                if (!path) {
                    $('state').textContent = 'No digital PDF attached to this book.';
                    return;
                }

                const translations = data.content_translations || [];
                const matchedTranslation = translations.find(x => x.language_code === 'en') || translations.find(x => x.title) || {};
                $('book-title').textContent = matchedTranslation.title || data.slug;

                const pdfUrl = getFileUrl(path);

                // Native Browser PDF Viewer embedding (Works smoothly for Internet Archive & Supabase links)
                $('main-viewer').innerHTML = `
                    <object data="${pdfUrl}" type="application/pdf" width="100%" height="100%">
                        <iframe src="${pdfUrl}" width="100%" height="100%">
                            <p class="state">Your browser does not support embedded PDFs. <a href="${pdfUrl}" target="_blank" style="color:#b58a4b;">Click here to download/open PDF</a>.</p>
                        </iframe>
                    </object>
                `;

            } catch (err) {
                console.error(err);
                $('state').textContent = 'An error occurred while loading the book reader.';
            }
        }

loadReader();
</script>
</body>
</html>
