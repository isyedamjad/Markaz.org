<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#111111">
    <title>Book Reader | Markaz.org</title>
    
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
    
    <style>
        :root {
            --paper: #161616;
            --bar-bg: rgba(20, 20, 20, 0.95);
            --accent: #b58a48;
            --text-main: #f0f0f0;
            --line: #333;
        }
        * { box-sizing: border-box; touch-action: manipulation; }
        body {
            margin: 0;
            background: var(--paper);
            color: var(--text-main);
            font-family: 'DM Sans', sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        
        /* Top Header Bar */
        .top-bar {
            background: var(--bar-bg);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--line);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 10;
            height: 50px;
        }
        .brand {
            font: 600 0.95rem 'Playfair Display', serif;
            color: #fff;
            text-decoration: none;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 75%;
        }
        .close-btn {
            background: #2a2a2a;
            border: 1px solid #444;
            color: #ccc;
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            text-decoration: none;
        }

        /* Main Viewer Workspace */
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            background: #111;
            overflow: auto;
            padding-bottom: 70px; /* Floating Bottom Bar Space */
        }
        #canvas-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            overflow: auto;
            padding: 10px;
        }
        canvas {
            display: block;
            margin: auto;
            max-width: 100%;
            height: auto;
            box-shadow: 0 8px 30px rgba(0,0,0,0.8);
            background: #fff;
            border-radius: 2px;
        }

        /* Loading Overlay - Fixed Absolute Screen Centering */
        .state {
            position: absolute;
            inset: 0;
            background: #111;
            color: #aaa;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            z-index: 20;
            font-size: 0.95rem;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #333;
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Rekhta Style Bottom Floating Control Bar */
        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(22, 22, 22, 0.95);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
            z-index: 100;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.5);
            height: 64px;
        }
        .tool-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .circle-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            transition: background 0.2s, border-color 0.2s;
        }
        .circle-btn:active {
            transform: scale(0.95);
        }
        .circle-btn:hover:not(:disabled) {
            background: var(--accent);
            border-color: var(--accent);
            color: #111;
        }
        .circle-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        .page-indicator {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 0.95rem;
            color: #eee;
            font-weight: 600;
        }
        .page-indicator span.sub {
            font-size: 0.7rem;
            color: #888;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body>

    <!-- Top Header Bar -->
    <header class="top-bar">
        <a class="brand" href="library.html" id="book-title">Loading...</a>
        <a class="close-btn" href="library.html">Close</a>
    </header>

    <!-- Main Reader Space -->
    <main id="main-viewer">
        <div id="state" class="state">
            <div class="spinner"></div>
            <span id="state-text">Kitab load ho rahi hai...</span>
        </div>
        <div id="canvas-container">
            <canvas id="pdf-render"></canvas>
        </div>
    </main>

    <!-- Rekhta Bottom Floating Toolbar -->
    <footer class="bottom-bar" id="bottom-controls">
        <div class="tool-group">
            <button id="zoom-out" class="circle-btn" title="Zoom Out">−</button>
            <button id="zoom-in" class="circle-btn" title="Zoom In">+</button>
        </div>

        <div class="page-indicator">
            <div><span id="page-num">1</span> / <span id="page-count">--</span></div>
            <span class="sub">PAGE</span>
        </div>

        <div class="tool-group">
            <button id="prev-btn" class="circle-btn" disabled title="Previous Page">‹</button>
            <button id="next-btn" class="circle-btn" disabled title="Next Page">›</button>
        </div>
    </footer>

    <script>
        const SUPABASE_URL = 'https://pooatzegjnegutflkcbm.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_i402B2jbhWe_gLBegubEaQ_Nmfpi0vN';
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const $ = id => document.getElementById(id);

        let pdfDoc = null,
            pageNum = 1,
            pageRendering = false,
            pageNumPending = null,
            scale = 1.3,
            canvas = $('pdf-render'),
            ctx = canvas.getContext('2d');

        function getFileUrl(path) {
            if (!path) return '';
            if (/^https?:\/\//i.test(path)) {
                return 'https://api.allorigins.win/raw?url=' + encodeURIComponent(path);
            }
            const cleanPath = path.startsWith('/') ? path.slice(1) : path;
            return `${SUPABASE_URL}/storage/v1/object/public/book/${cleanPath}`;
        }

        function renderPage(num) {
            if (!pdfDoc) return;
            pageRendering = true;

            pdfDoc.getPage(num).then(page => {
                const viewport = page.getViewport({ scale: scale });
                
                // Device Pixel Ratio Smooth Quality Adjustment
                const outputScale = window.devicePixelRatio || 1;
                canvas.width = Math.floor(viewport.width * outputScale);
                canvas.height = Math.floor(viewport.height * outputScale);
                canvas.style.width = Math.floor(viewport.width) + "px";
                canvas.style.height = "auto";

                const transform = outputScale !== 1 
                    ? [outputScale, 0, 0, outputScale, 0, 0] 
                    : null;

                const renderContext = {
                    canvasContext: ctx,
                    transform: transform,
                    viewport: viewport
                };

                const renderTask = page.render(renderContext);

                renderTask.promise.then(() => {
                    pageRendering = false;
                    
                    // Hide Loading Overlay completely once first page is drawn
                    $('state').style.display = 'none';

                    if (pageNumPending !== null) {
                        renderPage(pageNumPending);
                        pageNumPending = null;
                    }
                });
            });

            $('page-num').textContent = num;
            $('prev-btn').disabled = (num <= 1);$('next-btn').disabled = (num >= pdfDoc.numPages);
        }

        function queueRenderPage(num) {
            if (pageRendering) {
                pageNumPending = num;
            } else {
                renderPage(num);
            }
        }

        function onPrevPage() {
            if (pageNum <= 1) return;
            pageNum--;
            queueRenderPage(pageNum);
        }

        function onNextPage() {
            if (!pdfDoc || pageNum >= pdfDoc.numPages) return;
            pageNum++;
            queueRenderPage(pageNum);
        }

        // Button Event Listeners
        $('prev-btn').addEventListener('click', onPrevPage);$('next-btn').addEventListener('click', onNextPage);

        // Functional Zoom Controls
        $('zoom-in').addEventListener('click', () => {
            if (!pdfDoc) return;
            scale += 0.25;
            if (scale > 3.0) scale = 3.0;
            queueRenderPage(pageNum);
        });

        $('zoom-out').addEventListener('click', () => {
            if (!pdfDoc) return;
            scale -= 0.25;
            if (scale < 0.6) scale = 0.6;
            queueRenderPage(pageNum);
        });

        // Touch Swipe Navigation for Mobile
        let touchstartX = 0, touchendX = 0;
        const mainViewer = $('main-viewer');
        
        mainViewer.addEventListener('touchstart', e => { 
            touchstartX = e.changedTouches[0].screenX; 
        }, { passive: true });

        mainViewer.addEventListener('touchend', e => {
            touchendX = e.changedTouches[0].screenX;
            const dist = touchendX - touchstartX;
            if (Math.abs(dist) > 50) {
                if (dist < 0) onNextPage();  // Swipe Left -> Next
                else onPrevPage();          // Swipe Right -> Prev
            }
        }, { passive: true });

        async function loadReader() {
            try {
                const params = new URLSearchParams(window.location.search);
                const slug = params.get('slug');

                if (!slug) {
                    $('state-text').textContent = 'No book selected.';
                    return;
                }

                const { data, error } = await db
                    .from('content_items')
                    .select('id, slug, content_translations(language_code, title), book_details(*)')
                    .eq('slug', slug)
                    .eq('status', 'published')
                    .maybeSingle();

                if (error || !data) {
                    $('state-text').textContent = 'Book unavailable or not found.';
                    return;
                }

                const details = Array.isArray(data.book_details) ? data.book_details[0] : data.book_details;
                const path = details?.pdf_storage_path || details?.epub_storage_path;

                if (!path) {
                    $('state-text').textContent = 'No digital PDF attached to this book.';
                    return;
                }

                const translations = data.content_translations || [];
                const matchedTranslation = translations.find(x => x.language_code === 'en') || translations.find(x => x.title) || {};
                $('book-title').textContent = matchedTranslation.title || data.slug;

                const targetUrl = getFileUrl(path);

                // Fetch PDF ArrayBuffer
                const response = await fetch(targetUrl);
                if (!response.ok) throw new Error('Failed to fetch file');
                const arrayBuffer = await response.arrayBuffer();

                pdfjsLib.getDocument({ data: arrayBuffer }).promise.then(pdfDoc_ => {
                    pdfDoc = pdfDoc_;
                    $('page-count').textContent = pdfDoc.numPages;

                    // First page render triggering
                    renderPage(pageNum);
                }).catch(err => {
                    console.error(err);
                    $('state-text').textContent = 'PDF render karne mein samasya aayi.';
                });

            } catch (err) {
                console.error(err);
                $('state-text').textContent = 'Network error ya file load nahi ho saki.';
            }
        }

        loadReader();
    </script>
</body>
</html>
