<html lang="en">
<head>
    <meta charset="UTF-8">

    <style>
        :root {
            --paper: #161616;
            --bar-bg: rgba(20, 20, 20, 0.95);
            --accent: #b58a48;
            --text-main: #f0f0f0;
            --line: #333;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--paper);
            color: var(--text-main);
            font-family: 'DM Sans', sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        
        .top-bar {
            background: var(--bar-bg);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--line);
            padding: 8px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 10;
            min-height: 56px;
        }
        .header-meta {
            display: flex;
            flex-direction: column;
            max-width: 75%;
            overflow: hidden;
        }
        .brand {
            font: 600 0.95rem 'Playfair Display', serif;
            color: #fff;
            text-decoration: none;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .author-name {
            font-size: 0.75rem;
            color: #aaa;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 1px;
        }
        .close-btn {
            background: #2a2a2a;
            border: 1px solid #444;
            color: #ccc;
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            text-decoration: none;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            background: #111;
            overflow: auto;
            padding-bottom: 70px;
            -webkit-overflow-scrolling: touch;
        }
        #canvas-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            overflow: auto;
            padding: 10px;
        }
        canvas {
            display: block;
            margin: auto;
            max-width: 100%;
            height: auto;
            box-shadow: 0 8px 30px rgba(0,0,0,0.8);
            background: #fff;
            border-radius: 2px;
            transition: transform 0.1s ease-out;
        }

        .state {
            position: absolute;
            inset: 0;
            background: #111;
            color: #aaa;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            z-index: 20;
            font-size: 0.95rem;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #333;
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(22, 22, 22, 0.95);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 16px;
            z-index: 100;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.5);
            height: 64px;
        }
        .tool-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .circle-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            transition: background 0.2s, border-color 0.2s;
        }
        .circle-btn:active {
            transform: scale(0.95);
        }
        .circle-btn:hover:not(:disabled) {
            background: var(--accent);
            border-color: var(--accent);
            color: #111;
        }
        .circle-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        
        .page-input-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }
        .page-input-wrapper {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.9rem;
            color: #eee;
            font-weight: 600;
        }
        .page-input-wrapper input {
            width: 48px;
            height: 30px;
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 6px;
            color: #fff;
            text-align: center;
            font-size: 0.9rem;
            font-weight: 600;
            outline: none;
        }
        .page-input-wrapper input:focus {
            border-color: var(--accent);
            background: #333;
        }
        .page-input-container span.sub {
            font-size: 0.65rem;
            color: #888;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
    </style>

<body>

    <header class="top-bar">
        <div class="header-meta">
            <a class="brand" href="#" id="book-title">Loading...</a>
            <div class="author-name" id="book-author">By: Markaz Library</div>
        </div>
        <a class="close-btn" href="library.html" id="close-link">Close</a>
    </header>

    <main id="main-viewer">
        <div id="state" class="state">
            <div class="spinner"></div>
            <span id="state-text">Book loading...</span>
        </div>
        <div id="canvas-container">
            <canvas id="pdf-render"></canvas>
        </div>
    </main>

    <footer class="bottom-bar" id="bottom-controls">
        <div class="tool-group">
            <button id="zoom-out" class="circle-btn" title="Zoom Out">−</button>
            <button id="zoom-in" class="circle-btn" title="Zoom In">+</button>
        </div>

        <div class="page-input-container">
            <div class="page-input-wrapper">
                <input type="number" id="page-input" min="1" value="1" aria-label="Page Number">
                <span>/ <span id="page-count">--</span></span>
            </div>
            <span class="sub">PAGE</span>
        </div>

        <div class="tool-group">
            <button id="prev-btn" class="circle-btn" disabled title="Previous Page">‹</button>
            <button id="next-btn" class="circle-btn" disabled title="Next Page">›</button>
        </div>
    </footer>

    <script>
        const SUPABASE_URL = 'https://pooatzegjnegutflkcbm.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_i402B2jbhWe_gLBegubEaQ_Nmfpi0vN';
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const $ = id => document.getElementById(id);

        let pdfDoc = null,
            pageNum = 1,
            pageRendering = false,
            pageNumPending = null,
            scale = 1.3,
            canvas = $('pdf-render'),
            ctx = canvas.getContext('2d');

        function getFileUrl(path) {
            if (!path) return '';
            if (/^https?:\/\//i.test(path)) {
                return 'https://api.allorigins.win/raw?url=' + encodeURIComponent(path);
            }
            const cleanPath = path.startsWith('/') ? path.slice(1) : path;
            return `${SUPABASE_URL}/storage/v1/object/public/book/${cleanPath}`;
        }

        function renderPage(num) {
            if (!pdfDoc) return;
            pageRendering = true;

            pdfDoc.getPage(num).then(page => {
                const viewport = page.getViewport({ scale: scale });
                
                const outputScale = window.devicePixelRatio || 1;
                canvas.width = Math.floor(viewport.width * outputScale);
                canvas.height = Math.floor(viewport.height * outputScale);
                canvas.style.width = Math.floor(viewport.width) + "px";
                canvas.style.height = "auto";

                const transform = outputScale !== 1 ? [outputScale, 0, 0, outputScale, 0, 0] : null;

                const renderContext = {
                    canvasContext: ctx,
                    transform: transform,
                    viewport: viewport
                };

                const renderTask = page.render(renderContext);

                renderTask.promise.then(() => {
                    pageRendering = false;
                    $('state').style.display = 'none';

                    if (pageNumPending !== null) {
                        renderPage(pageNumPending);
                        pageNumPending = null;
                    }
                });
            });

            $('page-input').value = num;
            $('prev-btn').disabled = (num <= 1);$('next-btn').disabled = (num >= pdfDoc.numPages);
        }

        function queueRenderPage(num) {
            if (pageRendering) {
                pageNumPending = num;
            } else {
                renderPage(num);
            }
        }

        function onPrevPage() {
            if (pageNum <= 1) return;
            pageNum--;
            queueRenderPage(pageNum);
        }

        function onNextPage() {
            if (!pdfDoc || pageNum >= pdfDoc.numPages) return;
            pageNum++;
            queueRenderPage(pageNum);
        }

        function goToInputPage() {
            if (!pdfDoc) return;
            let targetPage = parseInt($('page-input').value);
            if (isNaN(targetPage) || targetPage < 1) targetPage = 1;
            if (targetPage > pdfDoc.numPages) targetPage = pdfDoc.numPages;
            pageNum = targetPage;
            queueRenderPage(pageNum);
        }

        $('prev-btn').addEventListener('click', onPrevPage);$('next-btn').addEventListener('click', onNextPage);

        $('page-input').addEventListener('change', goToInputPage);$('page-input').addEventListener('keyup', e => {
            if (e.key === 'Enter') {
                goToInputPage();
                $('page-input').blur();
            }
        });

        $('zoom-in').addEventListener('click', () => {
            scale = parseFloat((scale + 0.25).toFixed(2));
            if (scale > 3.0) scale = 3.0;
            queueRenderPage(pageNum);
        });

        $('zoom-out').addEventListener('click', () => {
            scale = parseFloat((scale - 0.25).toFixed(2));
            if (scale < 0.8) scale = 0.8;
            queueRenderPage(pageNum);
        });

        let touchstartX = 0, touchendX = 0;
        const mainViewer = $('main-viewer');
        
        mainViewer.addEventListener('touchstart', e => { 
            touchstartX = e.changedTouches[0].screenX; 
        }, { passive: true });

        mainViewer.addEventListener('touchend', e => {
            touchendX = e.changedTouches[0].screenX;
            const dist = touchendX - touchstartX;
            if (Math.abs(dist) > 50) {
                if (dist < 0) onNextPage();
                else onPrevPage();
            }
        }, { passive: true });

        async function loadReader() {
            try {
                const params = new URLSearchParams(window.location.search);
                const slug = params.get('slug');

                if (!slug) {
                    $('state-text').textContent = 'No book selected.';
                    return;
                }

                // Updated link to point to book.html instead of book-detail.html
                $('close-link').href = `book.html?slug=${slug}`;
                $('book-title').href = `book.html?slug=${slug}`;

                const { data, error } = await db
                    .from('content_items')
                    .select('id, slug, content_translations(language_code, title), book_details(*)')
                    .eq('slug', slug)
                    .eq('status', 'published')
                    .maybeSingle();

                if (error || !data) {
                    $('state-text').textContent = 'Book unavailable or not found.';
                    return;
                }

                const details = Array.isArray(data.book_details) ? data.book_details[0] : data.book_details;
                const path = details?.pdf_storage_path || details?.epub_storage_path;

                if (!path) {
                    $('state-text').textContent = 'No digital PDF attached.';
                    return;
                }

                const translations = data.content_translations || [];
                const matchedTranslation = translations.find(x => x.language_code === 'en') || translations.find(x => x.title) || {};
                
                $('book-title').textContent = matchedTranslation.title || data.slug;

                let authorName = details?.author_name || details?.publisher || 'Traditional Text';
                $('book-author').textContent = `By: ${authorName}`;

                const targetUrl = getFileUrl(path);

                const loadingTask = pdfjsLib.getDocument({
                    url: targetUrl,
                    disableAutoFetch: false,
                    disableStream: false
                });

                loadingTask.promise.then(pdfDoc_ => {
                    pdfDoc = pdfDoc_;
                    $('page-count').textContent = pdfDoc.numPages;
                    $('page-input').max = pdfDoc.numPages;
                    renderPage(pageNum);
                }).catch(err => {
                    console.error(err);
                    $('state-text').textContent = 'Error loading PDF file.';
                });

            } catch (err) {
                console.error(err);
                $('state-text').textContent = 'Network error.';
            }
        }

        loadReader();
    </script>

function getLang(){try{var l=localStorage.getItem(KEY);return allowed.indexOf(l)>=0?l:'en'}catch(e){return 'en'}}
function saveLang(l){try{localStorage.setItem(KEY,l)}catch(e){}}
function norm(s){return (s||'').replace(/\s+/g,' ').trim()}
function original(el){if(!el.dataset.markazOriginal){el.dataset.markazOriginal=el.textContent}return el.dataset.markazOriginal}
function translateTextNode(node,lang){
 var p=node.parentElement;if(!p||p.closest('script,style,noscript,textarea,code,pre,input,select,option,[contenteditable="true"],#markaz-global-language'))return;
 if(node.__markazOriginal===undefined)node.__markazOriginal=node.nodeValue;
 var raw=node.__markazOriginal, key=norm(raw); if(!key)return;
 var hit=dict[key]; if(hit){var val=lang==='hi'?hit[0]:lang==='ur'?hit[1]:key;
   if(raw.trim()===raw)node.nodeValue=val;
   else {var lead=raw.match(/^\s*/)[0],trail=raw.match(/\s*$/)[0];node.nodeValue=lead+val+trail;}
 } else {node.nodeValue=raw;}
}
function apply(lang){
 if(allowed.indexOf(lang)<0)lang='en';saveLang(lang);
 document.documentElement.lang=lang;document.documentElement.dir=lang==='ur'?'rtl':'ltr';
 document.body.classList.toggle('markaz-urdu',lang==='ur');
 document.querySelectorAll('[data-en],[data-hi],[data-ur]').forEach(function(el){
   var v=el.getAttribute('data-'+lang);
   if(v!==null){if(el.matches('input,textarea'))el.placeholder=v;else if(el.children.length===0)el.textContent=v;}
 });
 document.querySelectorAll('[data-en-html]').forEach(function(el){var v=el.getAttribute('data-'+lang+'-html')||el.getAttribute('data-en-html');if(v!==null)el.innerHTML=v});
 var walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT),nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
 nodes.forEach(function(n){translateTextNode(n,lang)});
 document.querySelectorAll('input[placeholder],textarea[placeholder]').forEach(function(el){
   if(!el.dataset.markazPlaceholder)el.dataset.markazPlaceholder=el.placeholder;
   var key=norm(el.dataset.markazPlaceholder),hit=dict[key];if(hit)el.placeholder=lang==='hi'?hit[0]:lang==='ur'?hit[1]:el.dataset.markazPlaceholder;
 });
 document.querySelectorAll('#markaz-global-language button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.markazLang===lang?'true':'false')});
}
function addSwitcher(){
 if(document.getElementById('markaz-global-language'))return;
 var box=document.createElement('div');box.id='markaz-global-language';box.setAttribute('aria-label','Website language');
 box.innerHTML='<span>भाषा / زبان</span><button type="button" data-markaz-lang="en">EN</button><button type="button" data-markaz-lang="hi">हिन्दी</button><button type="button" data-markaz-lang="ur">اردو</button>';
 document.body.appendChild(box);
 box.addEventListener('click',function(e){var b=e.target.closest('button[data-markaz-lang]');if(!b)return;apply(b.dataset.markazLang)});
}
function start(){addSwitcher();apply(getLang());}
