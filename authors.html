<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#472127">
<meta name="description" content="Discover the lives, poetry, books, scholarship and spiritual legacy of Sufi authors at Markaz.org.">
<title>Author Profile | Markaz.org</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Nastaliq+Urdu&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
  --wine: #651c2c;
  --deep: #472127;
  --gold: #b58a48;
  --gold-light: #d7b77d;
  --paper: #fffdf8;
  --cream: #f7f1e8;
  --ink: #292321;
  --muted: #746b65;
  --line: #e8ddd0;
  --shadow: 0 8px 30px rgba(71,33,39,.06);
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--cream);
  color: var(--ink);
  font: 16px/1.8 system-ui,-apple-system,sans-serif;
}
body[dir="rtl"], html[dir="rtl"] body {
  font-family: "Noto Nastaliq Urdu",serif;
}
button, a { -webkit-tap-highlight-color: transparent; }
a { color: var(--wine); }
button { font: inherit; }
.topbar {
  background: var(--deep);
  color: white;
  padding: 17px clamp(16px,5vw,64px);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  flex-wrap: wrap;
  border-bottom: 3px solid var(--gold);
}
.brand {
  font: 700 clamp(24px,3vw,34px) "Playfair Display",serif;
  color: white;
  text-decoration: none;
  letter-spacing: -.5px;
}
.brand span { color: var(--gold-light); }
.languages { display: flex; gap: 8px; flex-wrap: wrap; }
.lang-btn {
  cursor: pointer;
  padding: 9px 17px;
  border: 1px solid rgba(255,255,255,.25);
  border-radius: 10px;
  background: #fffdf8;
  color: var(--deep);
  transition: .2s ease;
}
.lang-btn:hover, .lang-btn.active {
  background: var(--gold);
  color: white;
  border-color: var(--gold-light);
}
main {
  max-width: 1120px;
  min-height: 65vh;
  margin: 0 auto;
  padding: 34px 20px 60px;
}
.status {
  padding: 24px;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 18px;
  box-shadow: var(--shadow);
  overflow-wrap: anywhere;
}
.status-title {
  font: 600 23px "Playfair Display",serif;
  color: var(--deep);
  margin: 0 0 8px;
}
.status-detail { color: var(--muted); font-size: 14px; }
.spinner {
  width: 25px;
  height: 25px;
  border: 3px solid var(--line);
  border-top-color: var(--gold);
  border-radius: 50%;
  animation: spin .8s linear infinite;
  margin-bottom: 12px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.primary-btn {
  background: var(--deep);
  color: #ffffff !important;
  border: 0;
  border-radius: 9px;
  padding: 10px 18px;
  margin-top: 12px;
  cursor: pointer;
}
.primary-btn:hover { background: var(--wine); }
.hero {
  display: grid;
  grid-template-columns: 220px minmax(0,1fr);
  gap: 30px;
  align-items: start;
  padding: 30px;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 20px;
  box-shadow: var(--shadow);
  margin-bottom: 22px;
}
.portrait-wrap {
  width: 100%;
  text-align: center;
}
.portrait {
  display: block;
  width: 180px;
  height: 180px;
  object-fit: cover;
  border-radius: 50%; /* Circle shape */
  margin: 0 auto 12px;
  background: #eee1d0;
  border: 3px solid var(--gold);
}
.upload-btn-label {
  display: inline-block;
  font-size: 12px;
  color: var(--wine);
  background: var(--cream);
  padding: 5px 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  cursor: pointer;
  margin-top: 5px;
}
.upload-btn-label:hover {
  background: var(--gold-light);
}
.eyebrow {
  color: var(--gold);
  letter-spacing: 2px;
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
}
.profile-name {
  font: 700 clamp(30px,5vw,48px)/1.25 "Playfair Display",serif;
  color: var(--deep);
  margin: 7px 0 12px;
  overflow-wrap: anywhere;
}
.name-detail { color: var(--muted); margin-bottom: 12px; font-size: 15px; }
.short-bio { font-size: 17px; color: #514741; }
.facts {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 20px;
}
.fact {
  min-width: 120px;
  padding: 10px 13px;
  background: var(--cream);
  border: 1px solid var(--line);
  border-radius: 10px;
}
.fact-label {
  display: block;
  color: var(--muted);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .7px;
  font-weight: 700;
}
.panel {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 27px;
  margin-bottom: 22px;
  box-shadow: var(--shadow);
  scroll-margin-top: 20px;
}
.panel h2 {
  font: 700 27px/1.4 "Playfair Display",serif;
  color: var(--deep);
  margin: 0 0 18px;
}
.panel p { margin-top: 0; }
.profile-tabs {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin: 25px 0;
  border-bottom: 2px solid var(--line);
  padding-bottom: 15px;
}
.tab-btn {
  padding: 9px 18px;
  text-decoration: none;
  border: 1px solid var(--line);
  background: var(--paper);
  color: var(--deep);
  border-radius: 30px;
  cursor: pointer;
  font-weight: 600;
  font-size: 14px;
  transition: 0.2s;
}
.tab-btn:hover, .tab-btn.active {
  background: var(--deep);
  color: white;
  border-color: var(--deep);
}
.work-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(min(100%,250px),1fr));
  gap: 15px;
}
.work-card {
  border: 1px solid var(--line);
  border-radius: 13px;
  padding: 18px;
  background: #fffefa;
  min-width: 0;
}
.work-type {
  font-size: 11px;
  color: var(--gold);
  text-transform: uppercase;
  font-weight: 800;
  letter-spacing: 1.4px;
}
.work-title {
  font: 700 21px/1.4 "Playfair Display",serif;
  color: #292321 !important;
  margin: 5px 0 10px;
  overflow-wrap: anywhere;
}
.work-title a { color: #292321 !important; text-decoration: none; }
.work-excerpt { color: var(--muted); }
.empty {
  padding: 24px 10px;
  text-align: center;
  color: var(--muted);
  border: 1px dashed var(--line);
  border-radius: 12px;
}
.footer {
  text-align: center;
  color: var(--muted);
  padding: 27px 18px;
  border-top: 1px solid var(--line);
}
.footer strong {
  display: block;
  color: var(--deep);
  font: 600 19px "Playfair Display",serif;
}
[hidden] { display: none !important; }
@media(max-width:650px) {
  .topbar { padding: 15px 17px; }
  .brand { font-size: 27px; }
  .languages { width: 100%; }
  .lang-btn { flex: 1; padding: 8px 10px; }
  main { padding: 22px 13px 40px; }
  .hero { grid-template-columns: 1fr; text-align: center; gap: 20px; padding: 20px; }
  .portrait { margin: 0 auto; }
  .facts { justify-content: center; }
  .profile-name { font-size: 26px; }
}
</style>
</head>

<body>
<header class="topbar">
  <a class="brand" href="index.html">Markaz<span>.org</span></a>
  <nav class="languages" aria-label="Choose language">
    <button class="lang-btn active" data-lang="en" type="button">English</button>
    <button class="lang-btn" data-lang="hi" type="button">हिन्दी</button>
    <button class="lang-btn" data-lang="ur" type="button">اردو</button>
  </nav>
</header>

<main>
  <div id="status" class="status" role="status" aria-live="polite">
    <div class="spinner" aria-hidden="true"></div>
    <h1 class="status-title">Loading profile…</h1>
    <p class="status-detail">Connecting to the Markaz.org digital library.</p>
  </div>
  <div id="content" hidden></div>
</main>

<footer class="footer">
  <strong>Markaz.org</strong>
  A Sanctuary of Sufi Literature, Scholarship and Spiritual Heritage.
</footer>

<script>
(function () {
  "use strict";

  const SUPABASE_URL = "https://pooatzegjnegutflkcbm.supabase.co";
  const SUPABASE_KEY = "sb_publishable_i402B2jbhWe_gLBegubEaQ_Nmfpi0vN";
  const PLACEHOLDER = "https://placehold.co/500x650/f0e4d8/651c2c?text=Markaz.org";

  const statusEl = document.getElementById("status");
  const contentEl = document.getElementById("content");

  let db = null;
  let profile = null;
  let translations = [];
  let works = [];
  let currentLang = "en";
  let currentTab = "profile"; // Default tab
  let loading = false;

  const LABELS = {
    en: {
      loading: "Loading profile…",
      connecting: "Connecting to the Markaz.org digital library.",
      category: "Author & Poet Profile",
      born: "Born",

    },
    hi: {
      loading: "प्रोफ़ाइल लोड हो रही है…",
      connecting: "Markaz.org डिजिटल लाइब्रेरी से जुड़ रहे हैं।",

      born: "जन्म तिथि",

      birthPlace: "जन्म स्थान",
      deathPlace: "वफ़ात स्थान",

      noWorks: "इस सेक्शन में कोई रचना उपलब्ध नहीं है।",
      notFound: "प्रोफ़ाइल नहीं मिली या अभी प्रकाशित नहीं है।",
      missingSlug: "URL में प्रोफ़ाइल का slug नहीं मिला।",
      retry: "दोबारा कोशिश करें",
      error: "प्रोफ़ाइल लोड नहीं हो सकी",
      check: "प्रोफ़ाइल का status, Supabase permissions और इंटरनेट कनेक्शन जाँचें।",
      unknown: "एक अनजान त्रुटि हुई।",
      authorsListTitle: "सभी लेखक और शायर",
      authorsListSubtitle: "सभी प्रकाशित लेखकों और विद्वानों की प्रोफ़ाइल देखें।",
      uploadPhoto: "तस्वीर बदलें",
      tabs: {
        profile: "प्रोफ़ाइल",
        naat: "नात",
        manqabat: "منقبت",
        ghazal: "ग़ज़ल",
        article: "लेख",
        sher: "शेर"
      }
    },
    ur: {
      loading: "پروفائل لوڈ ہو رہی ہے…",
      connecting: "مرکز ڈاٹ آرگ کی ڈیجیٹل لائبریری سے رابطہ ہو رہا ہے۔",
      category: "مصنف اور شاعر کا تعارف",
      born: "تاریخ پیدائش",
      died: "تاریخ وفات",
      birthPlace: "جائے پیدائش",
      deathPlace: "جائے وفات",
      realName: "اصل نام",
      penName: "تخلص",
      bio: "سوانح",
      legacy: "زندگی اور علمی وراثت",
      read: "متن پڑھیے",
      noBio: "سوانح ابھی شامل نہیں کی گئی ہے۔",
      noWorks: "اس زمرے میں کوئی تصنیف دستیاب نہیں ہے۔",
      notFound: "پروفائل نہیں ملی یا ابھی شائع نہیں ہوئی ہے۔",
      missingSlug: "URL میں پروفائل کا slug موجود نہیں ہے۔",
      retry: "دوبارہ کوشش کریں",
      error: "پروفائل لوڈ نہیں ہو سکی",
      check: "प्रोफ़ाइल का status، Supabase permissions और انٹرنیٹ کنکشن چیک کریں۔",
      unknown: "ایک غیر متوقع خرابی پیش آئی۔",
      authorsListTitle: "تمام مصنفین اور شعرا",
      authorsListSubtitle: "تمام شائع شدہ مصنفین اور محققین کے پروفائلز دیکھیں۔",
      uploadPhoto: "تصویر تبدیل کریں",
      tabs: {
        profile: "پروفائل",
        naat: "نعت",
        manqabat: "منقبت",
        ghazal: "غزل",
        article: "مقالات",
        sher: "اشعار"
      }
    }
  };

  function labels() {
    return LABELS[currentLang] || LABELS.en;
  }

  function escapeHTML(value) {
    return String(value == null ? "" : value).replace(/[&<>"']/g, function (ch) {
      return {
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[ch];
    });
  }

  function withLineBreaks(value) {
    return escapeHTML(value).replace(/\r?\n/g, "<br>");
  }

  function pickTranslation(rows) {
    if (!Array.isArray(rows) || !rows.length) return {};
    return rows.find(x => x.language_code === currentLang)
      || rows.find(x => x.language_code === "en")
      || rows[0]
      || {};
  }

  function getSlug() {
    const params = new URLSearchParams(window.location.search);
    const querySlug = params.get("slug");
    if (querySlug) return querySlug.trim();

    const parts = window.location.pathname.split("/").filter(Boolean);
    const last = parts[parts.length - 1] || "";
    return last.toLowerCase() === "authors.html" ? "" : last;
  }

  function showLoading() {
    statusEl.hidden = false;
    contentEl.hidden = true;
    statusEl.className = "status";
    statusEl.innerHTML =
      '<div class="spinner" aria-hidden="true"></div>' +
      '<h1 class="status-title">' + escapeHTML(labels().loading) + '</h1>' +
      '<p class="status-detail">' + escapeHTML(labels().connecting) + '</p>';
  }

  function renderAuthorsList(authorsList) {
    const L = labels();
    document.documentElement.lang = currentLang;
    document.documentElement.dir = currentLang === "ur" ? "rtl" : "ltr";
    document.title = L.authorsListTitle + " | Markaz.org";

    const cards = authorsList.map(author => {
      const img = author.profile_image_url || PLACEHOLDER;
      const name = author.real_name || author.pen_name || author.slug || "Author";
      return '<article class="work-card" style="display:flex;gap:15px;align-items:center;">' +
        '<img src="' + escapeHTML(img) + '" alt="' + escapeHTML(name) + '" style="width:70px;height:70px;object-fit:cover;border-radius:50%;" onerror="this.src=\'' + PLACEHOLDER + '\'">' +
        '<div>' +
          '<h3 class="work-title" style="margin:0 0 5px;"><a href="authors.html?slug=' + encodeURIComponent(author.slug) + '" style="color:#292321 !important;text-decoration:none;">' + escapeHTML(name) + '</a></h3>' +
          '<a href="authors.html?slug=' + encodeURIComponent(author.slug) + '" class="primary-btn" style="display:inline-block;text-decoration:none;font-size:12px;padding:6px 12px;margin-top:5px;color:#ffffff !important;">View Profile</a>' +
        '</div>' +
      '</article>';
    }).join("");

    contentEl.innerHTML =
      '<section class="panel">' +
        '<h2>' + escapeHTML(L.authorsListTitle) + '</h2>' +
        '<p class="status-detail" style="margin-bottom:20px;">' + escapeHTML(L.authorsListSubtitle) + '</p>' +
        (cards ? '<div class="work-grid">' + cards + '</div>' : '<div class="empty">No authors found.</div>') +
      '</section>';

    statusEl.hidden = true;
    contentEl.hidden = false;
  }

  function renderProfile() {
    const L = labels();
    const t = pickTranslation(translations);

    const displayName = t.display_name || profile.real_name || profile.pen_name || profile.slug || "Markaz.org";

    document.documentElement.lang = currentLang;
    document.documentElement.dir = currentLang === "ur" ? "rtl" : "ltr";
    document.title = displayName + " | Markaz.org";

    document.querySelectorAll("[data-lang]").forEach(function (button) {
      button.classList.toggle("active", button.dataset.lang === currentLang);
    });

    const realName = t.real_name || profile.real_name || "";
    const penName = t.pen_name || profile.pen_name || "";
    
    // Details conditional building
    let detailsArr = [];
    if (realName) detailsArr.push(`${L.realName}: ${realName}`);
    if (penName) detailsArr.push(`${L.penName}: ${penName}`);
    const subtitle = detailsArr.join(" · ");

    const imageURL = profile.profile_image_url || PLACEHOLDER;

    // Conditional Facts (Birth/Death Date & Place - hide if empty)[span_5](start_span)[span_5](end_span)
    let factsHTML = "";
    if (profile.birth_date) factsHTML += `<div class="fact"><span class="fact-label">${escapeHTML(L.born)}</span>${escapeHTML(profile.birth_date)}</div>`;
    if (profile.birth_place) factsHTML += `<div class="fact"><span class="fact-label">${escapeHTML(L.birthPlace)}</span>${escapeHTML(profile.birth_place)}</div>`;
    if (profile.death_date) factsHTML += `<div class="fact"><span class="fact-label">${escapeHTML(L.died)}</span>${escapeHTML(profile.death_date)}</div>`;
    if (profile.death_place) factsHTML += `<div class="fact"><span class="fact-label">${escapeHTML(L.deathPlace)}</span>${escapeHTML(profile.death_place)}</div>`;

    // Tabs Navigation HTML
    const tabsList = ['profile', 'naat', 'manqabat', 'ghazal', 'article', 'sher'];
    let tabsHTML = '<nav class="profile-tabs" aria-label="Author sections">';
    tabsList.forEach(tabKey => {
      const activeCls = currentTab === tabKey ? 'active' : '';
      const tabName = L.tabs[tabKey] || tabKey;
      tabsHTML += `<button class="tab-btn ${activeCls}" data-tab="${tabKey}">${escapeHTML(tabName)}</button>`;
    });
    tabsHTML += '</nav>';

    let mainContentHTML = "";

    if (currentTab === 'profile') {
      // Short Bio (< 100 words) & Long Bio (< 1000 words) rendering conditionally[span_6](start_span)[span_6](end_span)
      const shortBioHTML = t.short_bio ? `<p class="short-bio">${escapeHTML(t.short_bio)}</p>` : '';
      const longBioHTML = t.biography ? `<section class="panel"><h2>${escapeHTML(L.bio)}</h2><div>${withLineBreaks(t.biography)}</div></section>` : '';
      const legacyHTML = t.life_and_legacy ? `<section class="panel"><h2>${escapeHTML(L.legacy)}</h2><div>${withLineBreaks(t.life_and_legacy)}</div></section>` : '';

      mainContentHTML = shortBioHTML + longBioHTML + legacyHTML;
      if (!t.short_bio && !t.biography && !t.life_and_legacy) {
        mainContentHTML = `<div class="empty">${escapeHTML(L.noBio)}</div>`;
      }
    } else {
      // Filter works based on selected tab category/work_type
      const filteredWorks = works.filter(w => {
        const type = (w.work_type || "").toLowerCase();
        const cat = (w.category || "").toLowerCase();
        return type === currentTab || cat === currentTab;
      });

      const workCards = filteredWorks.map(work => {
        const tr = pickTranslation(work.author_work_translations || []);
        const title = tr.title || work.slug || "Work";
        const excerpt = tr.excerpt ? `<p class="work-excerpt">${escapeHTML(tr.excerpt)}</p>` : "";
        const targetPage = work.work_type === 'article' ? 'article.html' : 'work.html';
        const workUrl = `${targetPage}?slug=${encodeURIComponent(work.slug)}`;

        return `<article class="work-card">
          <div class="work-type">${escapeHTML(work.work_type || currentTab)}</div>
          <h3 class="work-title"><a href="${workUrl}">${escapeHTML(title)}</a></h3>
          ${excerpt}
          <a href="${workUrl}" class="primary-btn" style="display:inline-block;text-decoration:none;font-size:13px;padding:6px 14px;margin-top:10px;">${escapeHTML(L.read)}</a>
        </article>`;
      }).join("");

      mainContentHTML = workCards ? `<div class="work-grid">${workCards}</div>` : `<div class="empty">${escapeHTML(L.noWorks)}</div>`;
    }

    contentEl.innerHTML =
      '<section class="hero">' +
        '<div class="portrait-wrap">' +
          '<img class="portrait" id="authorImage" src="' + escapeHTML(imageURL) + '" alt="' + escapeHTML(displayName) + '" onerror="this.onerror=null;this.src=\'' + PLACEHOLDER + '\'">' +
          '<br>' +
          '<label class="upload-btn-label">' + escapeHTML(L.uploadPhoto) + '<input type="file" id="imageUploadInput" accept="image/*" style="display:none;"></label>' +
        '</div>' +
        '<div>' +
          '<div class="eyebrow">' + escapeHTML(L.category) + '</div>' +
          '<h1 class="profile-name">' + escapeHTML(displayName) + '</h1>' +
          (subtitle ? '<div class="name-detail">' + escapeHTML(subtitle) + '</div>' : '') +
          (factsHTML ? '<div class="facts">' + factsHTML + '</div>' : '') +
        '</div>' +
      '</section>' +
      tabsHTML +
      mainContentHTML;

    // Attach event listener for custom image upload[span_7](start_span)[span_7](end_span)
    const uploadInput = document.getElementById("imageUploadInput");
    if (uploadInput) {
      uploadInput.addEventListener("change", function(e) {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = function(event) {
            document.getElementById("authorImage").src = event.target.result;
          };
          reader.readAsDataURL(file);
        }
      });
    }

    // Attach tab button click listeners
    document.querySelectorAll(".tab-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        currentTab = btn.dataset.tab;
        renderProfile();
      });
    });

    statusEl.hidden = true;
    contentEl.hidden = false;
  }

  async function loadProfile() {
    if (loading) return;
    loading = true;
    showLoading();

    try {
      const slug = getSlug();

      if (!db) {
        db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      }

      if (!slug) {
        const listResult = await db
          .from("author_profiles")
          .select("*")
          .eq("status", "published")
          .order("created_at", { ascending: false });

        if (listResult.error) throw listResult.error;
        renderAuthorsList(listResult.data || []);
        loading = false;
        return;
      }

      const profileResult = await db
        .from("author_profiles")
        .select("*")
        .eq("slug", slug)
        .eq("status", "published")
        .maybeSingle();

      if (profileResult.error) throw profileResult.error;
      if (!profileResult.data) throw new Error(labels().notFound);

      profile = profileResult.data;

      const results = await Promise.all([
        db.from("author_profile_translations").select("*").eq("profile_id", profile.id),
        db.from("author_works").select("*, author_work_translations(*)").eq("profile_id", profile.id).eq("status", "published").order("created_at", { ascending: false })
      ]);

      if (results[0].error) throw results[0].error;
      if (results[1].error) throw results[1].error;

      translations = results[0].data || [];
      works = results[1].data || [];

      renderProfile();

    } catch (error) {
      console.error("Markaz.org profile error:", error);
      showError(error && error.message ? error.message : labels().unknown);
    } finally {
      loading = false;
    }
  }

  document.querySelectorAll("[data-lang]").forEach(function (button) {
    button.addEventListener("click", function () {
      currentLang = button.dataset.lang || "en";
      try { localStorage.setItem("markaz-lang", currentLang); } catch (_) {}
      loadProfile();
    });
  });

  try {
    const savedLanguage = localStorage.getItem("markaz-lang");
    if (savedLanguage && LABELS[savedLanguage]) {
      currentLang = savedLanguage;
    }
  } catch (_) {}

  loadProfile();
})();
</script>
</body>
</html>
