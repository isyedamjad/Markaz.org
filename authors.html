<style>
:root {
  --wine: #651c2c;
  --deep: #472127;
  --gold: #b58a48;
  --gold-light: #d7b77d;
  --paper: #fffdf8;
  --cream: #f7f1e8;
  --ink: #292321;
  --muted: #746b65;
  --line: #e8ddd0;
  --shadow: 0 8px 30px rgba(71,33,39,.06);
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--cream);
  color: var(--ink);
  font: 16px/1.8 system-ui,-apple-system,sans-serif;
}
body[dir="rtl"], html[dir="rtl"] body {
  font-family: "Noto Nastaliq Urdu",serif;
}
button, a { -webkit-tap-highlight-color: transparent; }
a { color: var(--wine); }
button { font: inherit; }
.topbar {
  background: var(--deep);
  color: white;
  padding: 17px clamp(16px,5vw,64px);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  flex-wrap: wrap;
  border-bottom: 3px solid var(--gold);
}
.brand {
  font: 700 clamp(24px,3vw,34px) "Playfair Display",serif;
  color: white;
  text-decoration: none;
  letter-spacing: -.5px;
}
.brand span { color: var(--gold-light); }
.languages { display: flex; gap: 8px; flex-wrap: wrap; }
.lang-btn {
  cursor: pointer;
  padding: 9px 17px;
  border: 1px solid rgba(255,255,255,.25);
  border-radius: 10px;
  background: #fffdf8;
  color: var(--deep);
  transition: .2s ease;
}
.lang-btn:hover, .lang-btn.active {
  background: var(--gold);
  color: white;
  border-color: var(--gold-light);
}
main {
  max-width: 1120px;
  min-height: 65vh;
  margin: 0 auto;
  padding: 34px 20px 60px;
}
.status {
  padding: 24px;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 18px;
  box-shadow: var(--shadow);
  overflow-wrap: anywhere;
}
.status-title {
  font: 600 23px "Playfair Display",serif;
  color: var(--deep);
  margin: 0 0 8px;
}
.status-detail { color: var(--muted); font-size: 14px; }
.spinner {
  width: 25px;
  height: 25px;
  border: 3px solid var(--line);
  border-top-color: var(--gold);
  border-radius: 50%;
  animation: spin .8s linear infinite;
  margin-bottom: 12px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.primary-btn {
  background: var(--deep);
  color: #ffffff !important;
  border: 0;
  border-radius: 9px;
  padding: 10px 18px;
  margin-top: 12px;
  cursor: pointer;
}
.primary-btn:hover { background: var(--wine); }
.hero {
  display: grid;
  grid-template-columns: 220px minmax(0,1fr);
  gap: 30px;
  align-items: center;
  padding: 30px;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 20px;
  box-shadow: var(--shadow);
  margin-bottom: 22px;
}
.portrait-wrap {
  width: 100%;
  text-align: center;
}
.portrait {
  display: block;
  width: 180px;
  height: 180px;
  object-fit: cover;
  border-radius: 50%;
  margin: 0 auto;
  background: #eee1d0;
  border: 3px solid var(--gold);
}
.profile-name {
  font: 700 clamp(30px,5vw,48px)/1.25 "Playfair Display",serif;
  color: var(--deep);
  margin: 0 0 8px;
  overflow-wrap: anywhere;
}
.short-bio { font-size: 17px; color: #514741; }
.facts {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 15px;
}
.fact {
  min-width: 120px;
  padding: 8px 12px;
  background: var(--cream);
  border: 1px solid var(--line);
  border-radius: 10px;
}
.fact-label {
  display: block;
  color: var(--muted);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .7px;
  font-weight: 700;
}
.panel {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 27px;
  margin-bottom: 22px;
  box-shadow: var(--shadow);
  scroll-margin-top: 20px;
}
.panel h2 {
  font: 700 27px/1.4 "Playfair Display",serif;
  color: var(--deep);
  margin: 0 0 18px;
}
.panel p { margin-top: 0; }
.profile-info-list {
  margin-bottom: 20px;
  font-size: 16px;
  line-height: 2;
}
.profile-info-item {
  margin-bottom: 8px;
}
.profile-info-label {
  font-weight: 700;
  color: var(--deep);
}
.profile-tabs {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin: 25px 0;
  border-bottom: 2px solid var(--line);
  padding-bottom: 15px;
}
.tab-btn {
  padding: 9px 18px;
  text-decoration: none;
  border: 1px solid var(--line);
  background: var(--paper);
  color: var(--deep);
  border-radius: 30px;
  cursor: pointer;
  font-weight: 600;
  font-size: 14px;
  transition: 0.2s;
}
.tab-btn:hover, .tab-btn.active {
  background: var(--deep);
  color: white;
  border-color: var(--deep);
}
.work-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(min(100%,250px),1fr));
  gap: 15px;
}
.work-card {
  border: 1px solid var(--line);
  border-radius: 13px;
  padding: 18px;
  background: #fffefa;
  min-width: 0;
  transition: transform 0.2s, box-shadow 0.2s;
}
.work-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow);
}
.work-type {
  font-size: 11px;
  color: var(--gold);
  text-transform: uppercase;
  font-weight: 800;
  letter-spacing: 1.4px;
}
.work-title {
  font: 700 21px/1.4 "Playfair Display",serif;
  color: #292321 !important;
  margin: 5px 0 10px;
  overflow-wrap: anywhere;
}
.work-title a { color: #292321 !important; text-decoration: none; }
.work-excerpt { color: var(--muted); margin: 0; }
.empty {
  padding: 24px 10px;
  text-align: center;
  color: var(--muted);
  border: 1px dashed var(--line);
  border-radius: 12px;
}
.footer {
  text-align: center;
  color: var(--muted);
  padding: 27px 18px;
  border-top: 1px solid var(--line);
}
.footer strong {
  display: block;
  color: var(--deep);
  font: 600 19px "Playfair Display",serif;
}
[hidden] { display: none !important; }
@media(max-width:650px) {
  .topbar { padding: 15px 17px; }
  .brand { font-size: 27px; }
  .languages { width: 100%; }
  .lang-btn { flex: 1; padding: 8px 10px; }
  main { padding: 22px 13px 40px; }
  .hero { grid-template-columns: 1fr; text-align: center; gap: 20px; padding: 20px; }
  .portrait { margin: 0 auto; }
  .facts { justify-content: center; }
  .profile-name { font-size: 26px; }
}

      check: "प्रोफ़ाइल का status، Supabase permissions اور انٹرنیٹ کنکشن چیک کریں۔",
      unknown: "ایک غیر متوقع خرابی پیش آئی۔",
      authorsListTitle: "تمام مصنفین اور شعرا",
      authorsListSubtitle: "تمام شائع شدہ مصنفین اور محققین کے پروفائلز دیکھیں۔",
      searchPlaceholder: "مصنفین، شعرا اور محققین تلاش کریں…",
      viewProfile: "پروفائل دیکھیں",
      noAuthors: "کوئی متعلقہ پروفائل نہیں ملی۔ دوسرا نام تلاش کریں۔",
      tabs: {
        profile: "پروفائل",
        naat: "نعت",
        manqabat: "منقبت",
        ghazal: "غزل",
        article: "مقالات",
        sher: "اشعار"
      }
    }
  };

  function labels() {
    return LABELS[currentLang] || LABELS.en;
  }

  function escapeHTML(value) {
    return String(value == null ? "" : value).replace(/[&<>"']/g, function (ch) {
      return {
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[ch];
    });
  }

  function withLineBreaks(value) {
    return escapeHTML(value).replace(/\r?\n/g, "<br>");
  }

  function pickTranslation(rows) {
    if (!Array.isArray(rows) || !rows.length) return {};
    
    // Check exact match for current selected language with biography content
    let match = rows.find(x => x.language_code === currentLang && (x.biography || x.display_name));
    if (match) return match;

    // Fallbacks
    return rows.find(x => x.language_code === "en")
      || rows.find(x => x.language_code === "ur")
      || rows.find(x => x.language_code === "hi")
      || rows[0]
      || {};
  }

  function getSlug() {
    const params = new URLSearchParams(window.location.search);
    const querySlug = params.get("slug");
    if (querySlug) return querySlug.trim();

    const parts = window.location.pathname.split("/").filter(Boolean);
    const last = parts[parts.length - 1] || "";
    return last.toLowerCase() === "authors.html" ? "" : last;
  }

  function showLoading() {
    statusEl.hidden = false;
    contentEl.hidden = true;
    statusEl.className = "status";
    statusEl.innerHTML =
      '<div class="spinner" aria-hidden="true"></div>' +
      '<h1 class="status-title">' + escapeHTML(labels().loading) + '</h1>' +
      '<p class="status-detail">' + escapeHTML(labels().connecting) + '</p>';
  }

  function renderAuthorsList(authorsList) {
    const L = labels();
    document.documentElement.lang = currentLang;
    document.documentElement.dir = currentLang === "ur" ? "rtl" : "ltr";
    document.title = L.authorsListTitle + " | Markaz.org";
    document.querySelectorAll("[data-lang]").forEach(function (button) {
      button.classList.toggle("active", button.dataset.lang === currentLang);
      button.setAttribute("aria-pressed", button.dataset.lang === currentLang ? "true" : "false");
    });

    const params = new URLSearchParams(window.location.search);
    const type = params.get("type") || "";
    const typeTitles = {poet:"Poets & Shayars",author:"Authors & Writers",scholar:"Scholars & Researchers",mufti:"Muftis",naatkhwan:"Naatkhwans",book_contributor:"Book Contributors",sufi:"Sufi Personalities",saint:"Saints & Mashaikh"};
    const heading = type ? (typeTitles[type] || "People & Contributors") : L.authorsListTitle;
    const prepared = (authorsList || []).map(author => {
      const tr = pickTranslation(author.author_profile_translations || []);
      const name = tr.display_name || author.display_name || author.real_name || tr.real_name || author.pen_name || tr.pen_name || author.slug || "Author";
      return {author, name, searchText:[name,author.real_name,tr.real_name,author.pen_name,tr.pen_name,author.slug].filter(Boolean).join(" ").toLocaleLowerCase()};
    }).sort((a,b) => a.name.localeCompare(b.name, currentLang === "ur" ? "ur" : currentLang === "hi" ? "hi" : "en", {sensitivity:"base"}));

    const cards = prepared.map(({author,name,searchText}) => {
      const img = author.profile_image_url || PLACEHOLDER;
      const url = "authors.html?slug=" + encodeURIComponent(author.slug);
      return '<article class="work-card author-list-card" data-search="' + escapeHTML(searchText) + '" style="display:flex;gap:15px;align-items:center;">' +
        '<img loading="lazy" src="' + escapeHTML(img) + '" alt="' + escapeHTML(name) + '" style="width:76px;height:76px;flex:0 0 76px;object-fit:cover;border-radius:50%;border:2px solid var(--gold);" onerror="this.onerror=null;this.src=\'' + PLACEHOLDER + '\'">' +
        '<div style="min-width:0;flex:1;">' +
          '<h3 class="work-title" style="margin:0 0 5px;"><a href="' + url + '" style="text-decoration:none;">' + escapeHTML(name) + '</a></h3>' +
          '<a href="' + url + '" class="primary-btn" style="display:inline-block;text-decoration:none;font-size:12px;padding:6px 13px;margin-top:5px;">' + escapeHTML(L.viewProfile) + ' <span aria-hidden="true">↗</span></a>' +
        '</div></article>';
    }).join("");

    contentEl.innerHTML =
      '<section class="panel authors-directory">' +
        '<p class="profile-kicker" style="margin-top:0;">Markaz.org · Directory</p>' +
        '<h2>' + escapeHTML(heading) + '</h2>' +
        '<p class="status-detail" style="margin-bottom:20px;">' + escapeHTML(L.authorsListSubtitle) + '</p>' +
        '<div class="author-search-wrap"><label for="authorSearch" style="display:block;margin-bottom:7px;">' + escapeHTML(L.searchPlaceholder) + '</label>' +
        '<input id="authorSearch" type="search" class="author-search" placeholder="' + escapeHTML(L.searchPlaceholder) + '" autocomplete="off" aria-label="' + escapeHTML(L.searchPlaceholder) + '">' +
        '<p id="authorResultCount" class="status-detail" aria-live="polite" style="font-size:12px;margin:9px 2px 17px;"></p></div>' +
        '<div id="authorCards" class="work-grid">' + cards + '</div>' +
        '<div id="authorEmpty" class="empty" hidden>' + escapeHTML(L.noAuthors) + '</div>' +
      '</section>';

    const search = document.getElementById("authorSearch");
    const cardNodes = Array.from(document.querySelectorAll(".author-list-card"));
    const count = document.getElementById("authorResultCount");
    const empty = document.getElementById("authorEmpty");
    function filterAuthors() {
      const q = search.value.trim().toLocaleLowerCase();
      let shown = 0;
      cardNodes.forEach(card => {
        const match = !q || (card.dataset.search || "").includes(q);
        card.hidden = !match;
        if (match) shown++;
      });
      count.textContent = shown + " / " + cardNodes.length;
      empty.hidden = shown !== 0;
    }
    search.addEventListener("input", filterAuthors);
    filterAuthors();
    statusEl.hidden = true;
    contentEl.hidden = false;
  }

  function formatFullDate(value) {
    if (!value) return "";
    const raw = String(value).trim();
    // Parse date-only values as local calendar dates to avoid timezone shifts.
    let d = null;
    let m = raw.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
    if (m) d = new Date(Number(m[1]), Number(m[2])-1, Number(m[3]));
    if (!d) {
      m = raw.match(/^(\d{1,2})[./-](\d{1,2})[./-](\d{4})$/);
      if (m) d = new Date(Number(m[3]), Number(m[2])-1, Number(m[1]));
    }
    if (!d && /^\d{4}-\d{2}-\d{2}T/.test(raw)) {
      const parts = raw.slice(0,10).split("-");
      d = new Date(Number(parts[0]), Number(parts[1])-1, Number(parts[2]));
    }
    if (!d || Number.isNaN(d.getTime())) return raw;
    return d.getDate() + " " + ["January","February","March","April","May","June","July","August","September","October","November","December"][d.getMonth()] + " " + d.getFullYear();
  }

  function renderProfile() {
    const L = labels();
    const t = pickTranslation(translations);

    const displayName = t.display_name || profile.display_name || profile.real_name || t.real_name || profile.pen_name || t.pen_name || profile.slug || "Markaz.org";

    document.documentElement.lang = currentLang;
    document.documentElement.dir = currentLang === "ur" ? "rtl" : "ltr";
    document.title = displayName + " | Markaz.org";

    document.querySelectorAll("[data-lang]").forEach(function (button) {
      button.classList.toggle("active", button.dataset.lang === currentLang);
      button.setAttribute("aria-pressed", button.dataset.lang === currentLang ? "true" : "false");
    });

    const realName = t.real_name || profile.real_name || "";
    const penName = t.pen_name || profile.pen_name || "";
    const domicile = profile.domicile || profile.residence || t.domicile || "";

    const imageURL = profile.profile_image_url || PLACEHOLDER;

    function canonicalTab(value) {
      const raw = String(value || "").toLowerCase().trim().replace(/[ _-]+/g, " ");
      const aliases = {
        "profile":"profile", "biography":"profile", "bio":"profile",
        "naat":"naat", "naats":"naat", "naat sharif":"naat",
        "manqabat":"manqabat", "manqabat":"manqabat",
        "ghazal":"ghazal", "ghazals":"ghazal",
        "article":"article", "articles":"article", "essay":"article", "essays":"article",
        "sher":"sher", "ashaar":"sher", "poetry":"sher", "couplet":"sher", "couplets":"sher",
        "bait":"bait", "bayt":"bait", "rubai":"rubai", "rubaiyat":"rubai",
        "book":"book", "books":"book", "ebook":"book", "e book":"book", "e-book":"book",
        "salaam":"salaam", "salam":"salaam", "kalaam":"kalaam", "kalam":"kalaam",
        "qita":"qita", "qitah":"qita", "masnavi":"masnavi", "marsiya":"marsiya"
      };
      return aliases[raw] || (raw ? raw.replace(/[^a-z0-9]+/g, "-") : "");
    }
    function tabLabel(key) {
      const custom = {
        book: {en:"Books",hi:"पुस्तकें",ur:"کتب"},
        bait: {en:"Bait",hi:"बैत",ur:"بیت"},
        rubai: {en:"Rubaiyat",hi:"रुबाइयात",ur:"رباعیات"},
        salaam: {en:"Salaam",hi:"सलाम",ur:"سلام"},
        kalaam: {en:"Kalaam",hi:"कलाम",ur:"کلام"},
        qita: {en:"Qita",hi:"क़िता",ur:"قطعہ"},
        masnavi: {en:"Masnavi",hi:"मसनवी",ur:"مثنوی"},
        marsiya: {en:"Marsiya",hi:"मर्सिया",ur:"مرثیہ"}
      };
      return (custom[key] && custom[key][currentLang]) || L.tabs[key] || key.replace(/[-_]/g," ").replace(/\b\w/g, c => c.toUpperCase());
    }
    function workTab(work) {
      const known = new Set(["naat","manqabat","ghazal","article","sher","bait","rubai","book","salaam","kalaam","qita","masnavi","marsiya"]);
      const candidates = [work.work_type, work.category].map(canonicalTab).filter(Boolean);
      return candidates.find(key => known.has(key)) || candidates[0] || "other";
    }
    const profileHasContent = !!(
      realName || penName || profile.birth_date || domicile || profile.birth_place ||
      profile.death_date || profile.death_place ||
      (t.short_bio && !t.short_bio.includes("poori biography likhein")) ||
      (t.biography && !t.biography.includes("poori biography likhein")) || t.life_and_legacy
    );
    const tabCounts = {};
    works.forEach(work => {
      const key = workTab(work);
      tabCounts[key] = (tabCounts[key] || 0) + 1;
    });
    const availableTabs = [];
    if (profileHasContent) availableTabs.push("profile");
    Object.keys(tabCounts).forEach(key => {
      if (key && key !== "profile" && tabCounts[key] > 0) availableTabs.push(key);
    });
    if (!availableTabs.includes(currentTab)) currentTab = availableTabs[0] || "profile";

    let heroFactsHTML = "";
    if (profile.birth_date) heroFactsHTML += `<div class="fact"><span class="fact-label">${escapeHTML(L.born)}</span>${escapeHTML(formatFullDate(profile.birth_date))}</div>`;
    if (domicile) heroFactsHTML += `<div class="fact"><span class="fact-label">${escapeHTML(L.domicile)}</span>${escapeHTML(domicile)}</div>`;

    let tabsHTML = '<nav class="profile-tabs" aria-label="Author sections">';
    availableTabs.forEach(tabKey => {
      const activeCls = currentTab === tabKey ? 'active' : '';
      const tabName = tabLabel(tabKey);
      const count = tabKey === "profile" ? "" : `<span class="tab-count">${tabCounts[tabKey] || 0}</span>`;
      tabsHTML += `<button class="tab-btn ${activeCls}" data-tab="${escapeHTML(tabKey)}">${escapeHTML(tabName)}${count}</button>`;
    });
    tabsHTML += '</nav>';

    let mainContentHTML = "";

    if (currentTab === 'profile') {
      let infoItems = [];
      if (realName) infoItems.push(`<div class="profile-info-item"><span class="profile-info-label">${escapeHTML(L.realName)}:</span> ${escapeHTML(realName)}</div>`);
      if (penName) infoItems.push(`<div class="profile-info-item"><span class="profile-info-label">${escapeHTML(L.penName)}:</span> ${escapeHTML(penName)}</div>`);
      if (profile.birth_place) infoItems.push(`<div class="profile-info-item"><span class="profile-info-label">${escapeHTML(L.birthPlace)}:</span> ${escapeHTML(profile.birth_place)}</div>`);
      if (profile.death_date) infoItems.push(`<div class="profile-info-item"><span class="profile-info-label">${escapeHTML(L.died)}:</span> ${escapeHTML(formatFullDate(profile.death_date))}</div>`);
      if (profile.death_place) infoItems.push(`<div class="profile-info-item"><span class="profile-info-label">${escapeHTML(L.deathPlace)}:</span> ${escapeHTML(profile.death_place)}</div>`);

      const infoSectionHTML = infoItems.length ? `<div class="profile-info-list">${infoItems.join('')}</div>` : '';
      const shortBioHTML = (t.short_bio && !t.short_bio.includes("poori biography likhein")) ? `<p class="short-bio" style="margin-bottom:20px;">${escapeHTML(t.short_bio)}</p>` : '';

      // Check if biography exists and isn't placeholder text
      let validBiography = (t.biography && !t.biography.includes("poori biography likhein")) ? t.biography : null;

      const longBioHTML = validBiography ? `<section class="panel"><h2>${escapeHTML(L.bio)}</h2><div>${withLineBreaks(validBiography)}</div></section>` : '';
      const legacyHTML = t.life_and_legacy ? `<section class="panel"><h2>${escapeHTML(L.legacy)}</h2><div>${withLineBreaks(t.life_and_legacy)}</div></section>` : '';

      mainContentHTML = infoSectionHTML + shortBioHTML + longBioHTML + legacyHTML;
      
      if (!infoItems.length && !shortBioHTML && !validBiography && !t.life_and_legacy) {
        mainContentHTML = `<div class="empty">${escapeHTML(L.noBio)}</div>`;
      }
    } else {
      const filteredWorks = works.filter(w => workTab(w) === currentTab);

      const workCards = filteredWorks.map(work => {
        const tr = pickTranslation(work.author_work_translations || []);
        const title = tr.title || work.slug || "Work";
        const excerpt = tr.excerpt ? `<p class="work-excerpt">${escapeHTML(tr.excerpt)}</p>` : "";
        const targetPage = work.work_type === 'article' ? 'article.html' : 'work.html';
        const workUrl = `${targetPage}?slug=${encodeURIComponent(work.slug)}`;

        return `<article class="work-card">
          <div class="work-type">${escapeHTML(work.work_type || currentTab)}</div>
          <h3 class="work-title"><a href="${workUrl}">${escapeHTML(title)}</a></h3>
          ${excerpt ? `<a href="${workUrl}" style="text-decoration:none;color:inherit;">${excerpt}</a>` : ''}
        </article>`;
      }).join("");

      mainContentHTML = workCards ? `<div class="work-grid">${workCards}</div>` : `<div class="empty">${escapeHTML(L.noWorks)}</div>`;
    }

    contentEl.innerHTML =
      '<section class="hero">' +
        '<div class="portrait-wrap">' +
          '<img class="portrait" src="' + escapeHTML(imageURL) + '" alt="' + escapeHTML(displayName) + '" onerror="this.onerror=null;this.src=\'' + PLACEHOLDER + '\'">' +
        '</div>' +
        '<div>' +
          '<p class="profile-kicker" data-profile-kicker="true">${escapeHTML(({en:"Markaz.org Profile",hi:"मरकज़ ओर्ग प्रोफाइल",ur:"مرکز آرگنائزیشن پروفائل"})[currentLang])}</p>' +
          '<h1 class="profile-name">' + escapeHTML(displayName) + '</h1>' +
          ((t.short_bio && !t.short_bio.includes("poori biography likhein")) ? '<p class="profile-subtitle">' + escapeHTML(t.short_bio) + '</p>' : '') +
          (heroFactsHTML ? '<div class="facts">' + heroFactsHTML + '</div>' : '') +
        '</div>' +
      '</section>' +
      tabsHTML +
      mainContentHTML;

    document.querySelectorAll(".tab-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        currentTab = btn.dataset.tab;
        renderProfile();
      });
    });

    statusEl.hidden = true;
    contentEl.hidden = false;
  }

  async function loadProfile() {
    if (loading) return;
    loading = true;
    showLoading();

    try {
      const slug = getSlug();
      const requestedType = new URLSearchParams(window.location.search).get("type") || "";

      if (!db) {
        db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      }

      if (!slug) {
        const listResult = await db
          .from("author_profiles")
          .select("*")
          .eq("status", "published")
          .order("created_at", { ascending: false });

        if (listResult.error) throw listResult.error;
        const allProfiles = listResult.data || [];
        const filteredProfiles = requestedType ? allProfiles.filter(p => (p.profile_type || "author") === requestedType || (p.role_tags || []).includes(requestedType)) : allProfiles;

        // Load translations so the author list uses Display Name first in the selected language.
        if (filteredProfiles.length) {
          const profileIds = filteredProfiles.map(p => p.id).filter(Boolean);
          if (profileIds.length) {
            const translationResult = await db
              .from("author_profile_translations")
              .select("*")
              .in("profile_id", profileIds);
            if (translationResult.error) throw translationResult.error;
            const translationsByProfile = {};
            (translationResult.data || []).forEach(row => {
              if (!translationsByProfile[row.profile_id]) translationsByProfile[row.profile_id] = [];
              translationsByProfile[row.profile_id].push(row);
            });
            filteredProfiles.forEach(author => {
              author.author_profile_translations = translationsByProfile[author.id] || [];
            });
          }
        }
        renderAuthorsList(filteredProfiles);
        loading = false;
        return;
      }

      const profileResult = await db
        .from("author_profiles")
        .select("*")
        .eq("slug", slug)
        .eq("status", "published")
        .maybeSingle();

      if (profileResult.error) throw profileResult.error;
      if (!profileResult.data) throw new Error(labels().notFound);

      profile = profileResult.data;

      const results = await Promise.all([
        db.from("author_profile_translations").select("*").eq("profile_id", profile.id),
        db.from("author_works").select("*, author_work_translations(*)").eq("profile_id", profile.id).eq("status", "published").order("created_at", { ascending: false })
      ]);

      if (results[0].error) throw results[0].error;
      if (results[1].error) throw results[1].error;

      translations = results[0].data || [];
      works = results[1].data || [];

      renderProfile();

    } catch (error) {
      console.error("Markaz.org profile error:", error);
      showError(error && error.message ? error.message : labels().unknown);
    } finally {
      loading = false;
    }
  }

  function showError(msg) {
    statusEl.hidden = false;
    contentEl.hidden = true;
    statusEl.className = "status";
    statusEl.innerHTML =
      '<h1 class="status-title">' + escapeHTML(labels().error) + '</h1>' +
      '<p class="status-detail">' + escapeHTML(msg) + '</p>';
  }

  document.querySelectorAll("[data-lang]").forEach(function (button) {
    button.addEventListener("click", function () {
      currentLang = button.dataset.lang || "en";
      try { localStorage.setItem("markaz-lang", currentLang); } catch (_) {}
      loadProfile();
    });
  });

  try {
    const savedLanguage = localStorage.getItem("markaz-lang");
    if (savedLanguage && LABELS[savedLanguage]) {
      currentLang = savedLanguage;
    }
  } catch (_) {}

  loadProfile();
})();
</script>
