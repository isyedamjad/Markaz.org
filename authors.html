<style>
:root {
  --wine: #651c2c;
  --deep: #472127;
  --gold: #b58a48;
  --gold-light: #d7b77d;
  --paper: #fffdf8;
  --cream: #f7f1e8;
  --ink: #292321;
  --muted: #746b65;
  --line: #e8ddd0;
  --shadow: 0 8px 30px rgba(71,33,39,.06);
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--cream);
  color: var(--ink);
  font: 16px/1.8 system-ui,-apple-system,sans-serif;
}
body[dir="rtl"], html[dir="rtl"] body {
  font-family: "Noto Nastaliq Urdu",serif;
}
button, a { -webkit-tap-highlight-color: transparent; }
a { color: var(--wine); }
button { font: inherit; }
.topbar {
  background: var(--deep);
  color: white;
  padding: 17px clamp(16px,5vw,64px);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  flex-wrap: wrap;
  border-bottom: 3px solid var(--gold);
}
.brand {
  font: 700 clamp(24px,3vw,34px) "Playfair Display",serif;
  color: white;
  text-decoration: none;
  letter-spacing: -.5px;
}
.brand span { color: var(--gold-light); }
.languages { display: flex; gap: 8px; flex-wrap: wrap; }
.lang-btn {
  cursor: pointer;
  padding: 9px 17px;
  border: 1px solid rgba(255,255,255,.25);
  border-radius: 10px;
  background: #fffdf8;
  color: var(--deep);
  transition: .2s ease;
}
.lang-btn:hover, .lang-btn.active {
  background: var(--gold);
  color: white;
  border-color: var(--gold-light);
}
main {
  max-width: 1120px;
  min-height: 65vh;
  margin: 0 auto;
  padding: 34px 20px 60px;
}
.status {
  padding: 24px;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 18px;
  box-shadow: var(--shadow);
  overflow-wrap: anywhere;
}
.status-title {
  font: 600 23px "Playfair Display",serif;
  color: var(--deep);
  margin: 0 0 8px;
}
.status-detail { color: var(--muted); font-size: 14px; }
.spinner {
  width: 25px;
  height: 25px;
  border: 3px solid var(--line);
  border-top-color: var(--gold);
  border-radius: 50%;
  animation: spin .8s linear infinite;
  margin-bottom: 12px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.primary-btn {
  background: var(--deep);
  color: white;
  border: 0;
  border-radius: 9px;
  padding: 10px 18px;
  margin-top: 12px;
  cursor: pointer;
}
.primary-btn:hover { background: var(--wine); }
.hero {
  display: grid;
  grid-template-columns: 220px minmax(0,1fr);
  gap: 30px;
  align-items: start;
  padding: 30px;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 20px;
  box-shadow: var(--shadow);
  margin-bottom: 22px;
}
.portrait-wrap {
  width: 100%;
  aspect-ratio: 3 / 4;
  overflow: hidden;
  border-radius: 14px;
  background: #eee1d0;
  border: 1px solid var(--line);
}
.portrait {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.eyebrow {
  color: var(--gold);
  letter-spacing: 2px;
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
}
.profile-name {
  font: 700 clamp(30px,5vw,48px)/1.25 "Playfair Display",serif;
  color: var(--deep);
  margin: 7px 0 12px;
  overflow-wrap: anywhere;
}
.name-detail { color: var(--muted); margin-bottom: 12px; }
.short-bio { font-size: 17px; color: #514741; }
.facts {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 20px;
}
.fact {
  min-width: 120px;
  padding: 10px 13px;
  background: var(--cream);
  border: 1px solid var(--line);
  border-radius: 10px;
}
.fact-label {
  display: block;
  color: var(--muted);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .7px;
  font-weight: 700;
}
.panel {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 27px;
  margin-bottom: 22px;
  box-shadow: var(--shadow);
  scroll-margin-top: 20px;
}
.panel h2 {
  font: 700 27px/1.4 "Playfair Display",serif;
  color: var(--deep);
  margin: 0 0 18px;
}
.panel p { margin-top: 0; }
.profile-nav {
  display: flex;
  gap: 9px;
  flex-wrap: wrap;
  margin: 25px 0;
}
.profile-nav a {
  display: inline-block;
  padding: 8px 15px;
  text-decoration: none;
  border: 1px solid var(--line);
  background: var(--paper);
  border-radius: 30px;
}
.profile-nav a:hover {
  background: var(--deep);
  color: white;
}
.work-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(min(100%,250px),1fr));
  gap: 15px;
}
.work-card {
  border: 1px solid var(--line);
  border-radius: 13px;
  padding: 18px;
  background: #fffefa;
  min-width: 0;
}
.work-type {
  font-size: 11px;
  color: var(--gold);
  text-transform: uppercase;
  font-weight: 800;
  letter-spacing: 1.4px;
}
.work-title {
  font: 700 21px/1.4 "Playfair Display",serif;
  color: var(--wine);
  margin: 5px 0 10px;
  overflow-wrap: anywhere;
}
.work-excerpt { color: var(--muted); }
.empty {
  padding: 24px 10px;
  text-align: center;
  color: var(--muted);
  border: 1px dashed var(--line);
  border-radius: 12px;
}
.footer {
  text-align: center;
  color: var(--muted);
  padding: 27px 18px;
  border-top: 1px solid var(--line);
}
.footer strong {
  display: block;
  color: var(--deep);
  font: 600 19px "Playfair Display",serif;
}
[hidden] { display: none !important; }
html[dir="rtl"] .profile-name,
html[dir="rtl"] .panel h2,
html[dir="rtl"] .work-title { font-family: "Noto Nastaliq Urdu",serif; }
@media(max-width:650px) {
  .topbar { padding: 15px 17px; }
  .brand { font-size: 27px; }
  .languages { width: 100%; }
  .lang-btn { flex: 1; padding: 8px 10px; }
  main { padding: 22px 13px 40px; }
  .hero { grid-template-columns: 105px minmax(0,1fr); gap: 15px; padding: 16px; }
  .profile-name { font-size: 26px; }
  .short-bio { font-size: 15px; }
  .facts { gap: 8px; margin-top: 13px; }
  .fact { min-width: 0; padding: 8px; flex: 1; }
  .panel { padding: 19px; }
  .panel h2 { font-size: 23px; }
}
@media(max-width:380px) {
  .hero { grid-template-columns: 1fr; }
  .portrait-wrap { max-width: 180px; }
}
</style>

  }

  function escapeHTML(value) {
    return String(value == null ? "" : value).replace(/[&<>"']/g, function (ch) {
      return {
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[ch];
    });
  }

  function withLineBreaks(value) {
    return escapeHTML(value).replace(/\r?\n/g, "<br>");
  }

  function pickTranslation(rows) {
    if (!Array.isArray(rows) || !rows.length) return {};
    return rows.find(x => x.language_code === currentLang)
      || rows.find(x => x.language_code === "en")
      || rows[0]
      || {};
  }

  function getSlug() {
    const params = new URLSearchParams(window.location.search);
    const querySlug = params.get("slug");
    if (querySlug) return querySlug.trim();

    const parts = window.location.pathname.split("/").filter(Boolean);
    const last = parts[parts.length - 1] || "";
    return last.toLowerCase() === "authors.html" ? "" : last;
  }

  function showLoading() {
    statusEl.hidden = false;
    contentEl.hidden = true;
    statusEl.className = "status";
    statusEl.innerHTML =
      '<div class="spinner" aria-hidden="true"></div>' +
      '<h1 class="status-title">' + escapeHTML(labels().loading) + '</h1>' +
      '<p class="status-detail">' + escapeHTML(labels().connecting) + '</p>';
  }

  function showError(message) {
    const L = labels();
    statusEl.hidden = false;
    contentEl.hidden = true;
    statusEl.className = "status";
    statusEl.replaceChildren();

    const title = document.createElement("h1");
    title.className = "status-title";
    title.textContent = L.error;

    const detail = document.createElement("p");
    detail.className = "status-detail";
    detail.textContent = message || L.unknown;

    const help = document.createElement("p");
    help.className = "status-detail";
    help.textContent = L.check;

    const retry = document.createElement("button");
    retry.className = "primary-btn";
    retry.type = "button";
    retry.textContent = L.retry;
    retry.addEventListener("click", loadProfile);

    statusEl.append(title, detail, help, retry);
  }

  function renderProfile() {
    const L = labels();
    const t = pickTranslation(translations);

    const displayName =
      t.display_name ||
      profile.pen_name ||
      profile.real_name ||
      profile.slug ||
      "Markaz.org";

    document.documentElement.lang = currentLang;
    document.documentElement.dir = currentLang === "ur" ? "rtl" : "ltr";
    document.title = displayName + " | Markaz.org";

    document.querySelectorAll("[data-lang]").forEach(function (button) {
      button.classList.toggle("active", button.dataset.lang === currentLang);
      button.setAttribute(
        "aria-pressed",
        button.dataset.lang === currentLang ? "true" : "false"
      );
    });

    const realName = t.real_name || profile.real_name || "";
    const penName = t.pen_name || profile.pen_name || "";
    const subtitle = [realName, penName && penName !== realName ? penName : ""]
      .filter(Boolean)
      .join(" · ");

    const bio = t.biography
      ? withLineBreaks(t.biography)
      : '<p class="status-detail">' + escapeHTML(L.noBio) + '</p>';

    const legacy = t.life_and_legacy
      ? '<section class="panel" id="legacy"><h2>' + escapeHTML(L.legacy) +
        '</h2><div>' + withLineBreaks(t.life_and_legacy) + '</div></section>'
      : "";

    const imageURL = profile.profile_image_url || PLACEHOLDER;

    const workCards = works.map(function (work) {
      const tr = pickTranslation(work.author_work_translations || []);
      const title = tr.title || work.slug || L.works;
      const excerpt = tr.excerpt
        ? '<p class="work-excerpt">' + escapeHTML(tr.excerpt) + '</p>'
        : "";

      // Route articles to article.html and other works to work.html
      const targetPage = work.work_type === 'article' ? 'article.html' : 'work.html';
      const workUrl = `${targetPage}?slug=${encodeURIComponent(work.slug)}`;

      return '<article class="work-card">' +
        '<div class="work-type">' + escapeHTML(work.work_type || "Work") + '</div>' +
        '<h3 class="work-title"><a href="' + workUrl + '" style="color:var(--wine);text-decoration:none;">' + escapeHTML(title) + '</a></h3>' +
        excerpt +
        '<a href="' + workUrl + '" class="primary-btn" style="display:inline-block;text-decoration:none;font-size:13px;padding:6px 14px;margin-top:10px;">' + escapeHTML(L.read) + '</a>' +
        '</article>';
    }).join("");

    contentEl.innerHTML =
      '<section class="hero">' +
        '<div class="portrait-wrap"><img class="portrait" src="' +
          escapeHTML(imageURL) + '" alt="' + escapeHTML(displayName) +
          '" onerror="this.onerror=null;this.src=\'' + PLACEHOLDER + '\'"></div>' +
        '<div>' +
          '<div class="eyebrow">' + escapeHTML(L.category) + '</div>' +
          '<h1 class="profile-name">' + escapeHTML(displayName) + '</h1>' +
          (subtitle ? '<div class="name-detail">' + escapeHTML(subtitle) + '</div>' : '') +
          (t.short_bio ? '<p class="short-bio">' + escapeHTML(t.short_bio) + '</p>' : '') +
          '<div class="facts">' +
            '<div class="fact"><span class="fact-label">' + escapeHTML(L.born) +
            '</span>' + escapeHTML(profile.birth_date || "—") + '</div>' +
            '<div class="fact"><span class="fact-label">' + escapeHTML(L.died) +
            '</span>' + escapeHTML(profile.death_date || "—") + '</div>' +
          '</div>' +
        '</div>' +
      '</section>' +

      '<nav class="profile-nav" aria-label="Profile sections">' +
        '<a href="#biography">' + escapeHTML(L.biography) + '</a>' +
        (t.life_and_legacy ? '<a href="#legacy">' + escapeHTML(L.legacy) + '</a>' : '') +
        '<a href="#works">' + escapeHTML(L.works) + '</a>' +
      '</nav>' +

      '<section class="panel" id="biography">' +
        '<h2>' + escapeHTML(L.biography) + '</h2>' + bio +
      '</section>' +

      legacy +

      '<section class="panel" id="works">' +
        '<h2>' + escapeHTML(L.works) + '</h2>' +
        (workCards
          ? '<div class="work-grid">' + workCards + '</div>'
          : '<div class="empty">' + escapeHTML(L.noWorks) + '</div>') +
      '</section>';

    statusEl.hidden = true;
    contentEl.hidden = false;
  }

  async function loadProfile() {
    if (loading) return;
    loading = true;
    showLoading();

    try {
      const slug = getSlug();

      if (!slug) {
        throw new Error(labels().missingSlug);
      }

      if (!db) {
        db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      }

      const profileResult = await db
        .from("author_profiles")
        .select("*")
        .eq("slug", slug)
        .eq("status", "published")
        .maybeSingle();

      if (profileResult.error) throw profileResult.error;
      if (!profileResult.data) throw new Error(labels().notFound);

      profile = profileResult.data;

      const results = await Promise.all([
        db.from("author_profile_translations")
          .select("*")
          .eq("profile_id", profile.id),

        db.from("author_works")
          .select("*, author_work_translations(*)")
          .eq("profile_id", profile.id)
          .eq("status", "published")
          .order("created_at", { ascending: false })
      ]);

      if (results[0].error) throw results[0].error;
      if (results[1].error) throw results[1].error;

      translations = results[0].data || [];
      works = results[1].data || [];

      renderProfile();

    } catch (error) {
      console.error("Markaz.org profile error:", error);
      showError(error && error.message ? error.message : labels().unknown);
    } finally {
      loading = false;
    }
  }

  document.querySelectorAll("[data-lang]").forEach(function (button) {
    button.addEventListener("click", function () {
      currentLang = button.dataset.lang || "en";

      try {
        localStorage.setItem("markaz-lang", currentLang);
      } catch (_) {}

      document.documentElement.lang = currentLang;
      document.documentElement.dir = currentLang === "ur" ? "rtl" : "ltr";

      document.querySelectorAll("[data-lang]").forEach(function (item) {
        item.classList.toggle("active", item.dataset.lang === currentLang);
      });

      if (profile) {
        renderProfile();
      } else if (!loading) {
        loadProfile();
      } else {
        const title = statusEl.querySelector(".status-title");
        if (title) title.textContent = labels().loading;
      }
    });
  });

  try {
    const savedLanguage = localStorage.getItem("markaz-lang");
    if (savedLanguage && LABELS[savedLanguage]) {
      currentLang = savedLanguage;
    }
  } catch (_) {}

  document.documentElement.lang = currentLang;
  document.documentElement.dir = currentLang === "ur" ? "rtl" : "ltr";

  loadProfile();
})();
</script>
</body>
</html>
