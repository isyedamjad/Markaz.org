
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#652e36">
<title>Library | Sufi Adab Archive</title>
<style>
:root {
  --wine:#652e36;
  --deep:#472127;
  --gold:#b28a4a;
  --paper:#fbf7ef;
  --ink:#29231f;
  --muted:#766b61;
  --line:#e8ddcc;
}
* { box-sizing:border-box; }
body {
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:Georgia,"Noto Serif",serif;
  line-height:1.6;
}
header {
  background:var(--deep);
  color:#fff8ed;
  border-bottom:3px solid var(--gold);
  padding:22px max(18px,calc((100% - 1120px)/2));
}
.brand { font-size:27px;font-weight:bold; }
.tag {
  color:#e2c99b;
  font:12px Arial,sans-serif;
  letter-spacing:2px;
  text-transform:uppercase;
}
nav {
  display:flex;gap:17px;flex-wrap:wrap;
  align-items:center;margin-top:15px;
  font:14px Arial,sans-serif;
}
nav a { color:#fff8ed;text-decoration:none; }
select,input {
  padding:11px 13px;border:1px solid var(--line);
  border-radius:7px;background:#fffdf9;color:var(--ink);
}
.wrap { max-width:1120px;margin:auto;padding:32px 20px 60px; }
.eyebrow {
  color:var(--gold);font:700 12px Arial,sans-serif;
  letter-spacing:3px;text-transform:uppercase;
}
h1 { color:var(--deep);font-size:clamp(34px,5vw,52px);margin:8px 0; }
.intro { color:var(--muted);max-width:720px; }
.tools { display:flex;gap:12px;flex-wrap:wrap;margin:25px 0; }
#search { flex:1;min-width:220px; }
.grid {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(225px,1fr));
  gap:20px;
}
.card {
  background:#fffdf9;border:1px solid var(--line);
  border-radius:11px;overflow:hidden;
  display:flex;flex-direction:column;
}
.cover {
  height:260px;background:#f0e6d5;
  display:flex;align-items:center;justify-content:center;
  color:var(--wine);font-size:42px;
}
.cover img { width:100%;height:100%;object-fit:contain; }
.info { padding:17px;display:flex;flex:1;flex-direction:column;gap:8px; }
.info h2 { color:var(--deep);font-size:21px;line-height:1.3;margin:0; }
.muted { color:var(--muted);font-size:14px; }
.btn {
  display:inline-block;background:var(--wine);color:white;
  border-radius:7px;padding:11px 15px;text-decoration:none;
  font:700 13px Arial,sans-serif;
}
.actions { margin-top:auto;padding-top:12px; }
.status {
  padding:18px;border:1px dashed var(--line);
  border-radius:8px;color:var(--muted);
}
footer {
  text-align:center;padding:22px;border-top:1px solid var(--line);
  color:var(--muted);font:12px Arial,sans-serif;
}
body.rtl { direction:rtl;text-align:right; }
body.rtl nav { direction:rtl; }
@media(max-width:600px) {
  .wrap { padding:25px 14px 45px; }
  .cover { height:225px; }
}
</style>
</head>
<body>
<header>
  <div class="brand">Sufi Adab Archive</div>
  <div class="tag">A living archive of Sufi literature</div>
  <nav>
    <a href="index.html">Home</a>
    <a href="library.html">Library</a>
    <a href="saints.html">Saints</a>
    <select id="language" aria-label="Language">
      <option value="en">English</option>
      <option value="hi">हिन्दी</option>
      <option value="ur">اردو</option>
    </select>
  </nav>
</header>

<main class="wrap">
  <div class="eyebrow" id="eyebrow">Digital Collection</div>
  <h1 id="heading">The Library</h1>
  <p class="intro" id="intro">
    Explore books from the Sufi literary tradition.
    Open any title to view its details and reading availability.
  </p>

  <div class="tools">
    <input id="search" type="search"
      placeholder="Search by title or author…">
    <select id="bookLanguage" aria-label="Filter books">
      <option value="">All languages</option>
      <option value="en">English</option>
      <option value="hi">Hindi</option>
      <option value="ur">Urdu</option>
      <option value="fa">Persian</option>
      <option value="ar">Arabic</option>
    </select>
  </div>

  <div id="status" class="status">Loading library…</div>
  <section id="books" class="grid"></section>
</main>

<footer>Sufi Adab Archive · Preserving literature, history and heritage</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL =
  "https://pooatzegjnegutflkcbm.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_i402B2jbhWe_gLBegubEaQ_Nmfpi0vN";

const db = window.supabase.createClient(
  SUPABASE_URL, SUPABASE_ANON_KEY
);

const translations = {
  en: {
    heading:"The Library",
    eyebrow:"Digital Collection",
    intro:"Explore books from the Sufi literary tradition. Open any title to view its details and reading availability.",
    search:"Search by title or author…",
    all:"All languages",
    read:"Read Now",
    loading:"Loading library…",
    empty:"No published books found.",
    error:"Unable to load books. Please try again later.",
    author:"Author"
  },
  hi: {
    heading:"पुस्तकालय",
    eyebrow:"डिजिटल संग्रह",
    intro:"सूफ़ी साहित्य की पुस्तकों को देखें। विवरण और पढ़ने की उपलब्धता जानने के लिए पुस्तक खोलें।",
    search:"शीर्षक या लेखक खोजें…",
    all:"सभी भाषाएँ",
    read:"अभी देखें",
    loading:"पुस्तकालय लोड हो रहा है…",
    empty:"कोई प्रकाशित पुस्तक नहीं मिली।",
    error:"पुस्तकें लोड नहीं हो सकीं। बाद में कोशिश करें।",
    author:"लेखक"
  },
  ur: {
    heading:"کتب خانہ",
    eyebrow:"ڈیجیٹل ذخیرہ",
    intro:"صوفی ادب کی کتابیں دیکھیں۔ تفصیلات اور مطالعے کی دستیابی کے لیے کتاب کھولیں۔",
    search:"عنوان یا مصنف تلاش کریں…",
    all:"تمام زبانیں",
    read:"ابھی دیکھیں",
    loading:"کتب خانہ لوڈ ہو رہا ہے…",
    empty:"کوئی شائع شدہ کتاب نہیں ملی۔",
    error:"کتابیں لوڈ نہیں ہو سکیں۔ بعد میں کوشش کریں۔",
    author:"مصنف"
  }
};

const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
let lang = params.get("lang") || "en";
let books = [];

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, ch => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;",
    '"':"&quot;", "'":"&#39;"
  }[ch]));
}

function getTranslation(record) {
  const list = record.content_translations || [];
  return list.find(t => t.language_code === lang)
      || list.find(t => t.language_code === "en")
      || list[0] || {};
}

function coverURL(record) {
  const meta = Array.isArray(record.book_details)
    ? record.book_details[0] || {}
    : record.book_details || {};

  return record.cover_url
      || record.image_url
      || record.cover_image_url
      || meta.cover_url
      || "";
}

function render() {
  const t = translations[lang] || translations.en;
  const query = $("search").value.trim().toLowerCase();
  const filter = $("bookLanguage").value;

  $("books").innerHTML = "";

  const filtered = books.filter(record => {
    const tr = getTranslation(record);
    const meta = Array.isArray(record.book_details)
      ? record.book_details[0] || {}
      : record.book_details || {};

    const searchable = [
      tr.title, tr.subtitle, tr.excerpt,
      meta.author_name, meta.publisher_name
    ].join(" ").toLowerCase();

    const languageMatches = !filter
      || (record.content_translations || [])
        .some(x => x.language_code === filter)
      || String(meta.language_name || "").toLowerCase() === filter;

    return searchable.includes(query) && languageMatches;
  });

  $("status").style.display = filtered.length ? "none" : "block";
  $("status").textContent = books.length ? t.empty : t.loading;

  filtered.forEach(record => {
    const tr = getTranslation(record);
    const meta = Array.isArray(record.book_details)
      ? record.book_details[0] || {}
      : record.book_details || {};

    const title = tr.title || record.slug || "Book";
    const cover = coverURL(record);
    const card = document.createElement("article");
    card.className = "card";

    const coverHTML = cover
      ? `<img loading="lazy" src="${escapeHTML(cover)}"
           alt="${escapeHTML(title)} cover"
           onerror="this.parentElement.textContent='✦'">`
      : "✦";

    card.innerHTML = `
      <div class="cover">${coverHTML}</div>
      <div class="info">
        <h2>${escapeHTML(title)}</h2>
        ${tr.subtitle
          ? `<div class="muted">${escapeHTML(tr.subtitle)}</div>` : ""}
        ${meta.author_name
          ? `<div class="muted">${escapeHTML(t.author)}: ${escapeHTML(meta.author_name)}</div>` : ""}
        <div class="actions">
          <a class="btn"
             href="book.html?slug=${encodeURIComponent(record.slug)}&lang=${encodeURIComponent(lang)}">
             ${escapeHTML(t.read)} →
          </a>
        </div>
      </div>`;

    $("books").appendChild(card);
  });
}

function applyLanguage() {
  const t = translations[lang] || translations.en;
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ur" ? "rtl" : "ltr";
  document.body.classList.toggle("rtl", lang === "ur");

  $("heading").textContent = t.heading;
  $("eyebrow").textContent = t.eyebrow;
  $("intro").textContent = t.intro;
  $("search").placeholder = t.search;
  $("bookLanguage").options[0].textContent = t.all;
  $("language").value = lang;
  render();
}

async function loadBooks() {
  const t = translations[lang] || translations.en;
  $("status").textContent = t.loading;

  try {
    let result = await db.from("content_items")
      .select("*,content_translations(*),book_details(*)")
      .eq("type", "book")
      .eq("status", "published")
      .order("created_at", {ascending:false});

    // Fallback if book_details table has not been created yet.
    if (result.error) {
      result = await db.from("content_items")
        .select("*,content_translations(*)")
        .eq("type", "book")
        .eq("status", "published")
        .order("created_at", {ascending:false});
    }

    if (result.error) throw result.error;

    books = result.data || [];
    render();

    if (!books.length) {
      $("status").style.display = "block";
      $("status").textContent = t.empty;
    }
  } catch (error) {
    console.error(error);
    $("status").style.display = "block";
    $("status").textContent = t.error;
  }
}

$("search").addEventListener("input", render);
$("bookLanguage").addEventListener("change", render);

$("language").addEventListener("change", event => {
  lang = event.target.value;
  const url = new URL(location.href);
  url.searchParams.set("lang", lang);
  history.replaceState({}, "", url);
  applyLanguage();
});

applyLanguage();
loadBooks();
</script>
</body>
</html>
